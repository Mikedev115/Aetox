<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetox companion</title>
<style>
/* The mascot's motion — every way it moves, in CSS, off one custom property.
 *
 * rig.ts emits the markup once per (identity, pose). This file is what makes
 * it turn, breathe, blink, wave and walk, and none of it runs JavaScript per
 * frame: the head turn is --t (degrees; 0 faces the viewer, +90 shows the
 * left ear, 180 the back), set on the root by Mascot.svelte, and everything
 * below is trigonometry the browser evaluates itself.
 *
 * Every part mounted on the head sphere declares its azimuth φ:
 *     x = 32 + R·sin(φ + t)   width = |cos(φ + t)|   in front when cos(φ + t) > 0
 * Held objects and hands sit at a depth d in front of the body:
 *     x' = 32 + (x − 32)·cos t + d·sin t
 * Sizes are viewBox units (the SVG is 64×64), which `transform-box: view-box`
 * makes the unit of every transform here.
 *
 * Global, not scoped: the markup arrives through {@html}, so a component's
 * scoped styles would never reach it. All names carry the ms- prefix. */

.mascot { --t: 0deg; display: block; flex: none; }
.mascot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.mascot .ms-face, .mascot .ms-back, .mascot .ms-ear, .mascot .ms-top, .mascot .ms-cap, .mascot .ms-torso,
.mascot .ms-leg, .mascot .ms-arm, .mascot .ms-prop, .mascot .ms-all, .mascot .ms-eyes, .mascot .ms-blink,
.mascot .ms-upper, .mascot .ms-palm,
.mascot .ms-lid, .mascot .ms-deck, .mascot .ms-deckF, .mascot .ms-deckL, .mascot .ms-deckR, .mascot .ms-lidL, .mascot .ms-lidR, .mascot .ms-sheet
  { transform-box: view-box; }

/* ---- the head ------------------------------------------------------------ */
/* φ = 0 · the face screen slides to the side, narrows with cos, fades past 90° */
.mascot .ms-face { transform-origin: 32px 0; transform: translateX(calc(13px * sin(var(--t)))) scaleX(max(.06, cos(var(--t)))); opacity: clamp(0, calc(cos(var(--t)) * 6), 1); }
/* φ = 180 · the grille on the back */
.mascot .ms-back { transform-origin: 32px 0; transform: translateX(calc(-13px * sin(var(--t)))) scaleX(max(.06, calc(-1 * cos(var(--t))))); opacity: clamp(0, calc(-6 * cos(var(--t))), 1); }
/* φ = ∓90 · the ears: thin plates hugging the head (scaleX floor .32 is the
   plate's thickness) that open into full discs as they come round. Two copies
   each — behind the head (z<0) and in front (z≥0) — swapped by opacity,
   because CSS cannot reorder the DOM. */
.mascot .ms-earL { transform-origin: 12.5px 29px; transform: translateX(calc(19.5px * (1 - cos(var(--t))))) scaleX(calc(.32 + .68 * abs(sin(var(--t))))); }
.mascot .ms-earR { transform-origin: 51.5px 29px; transform: translateX(calc(-19.5px * (1 - cos(var(--t))))) scaleX(calc(.32 + .68 * abs(sin(var(--t))))); }
.mascot .ms-earL.near { opacity: clamp(0, calc(sin(var(--t)) * 1000 + 1), 1); }
.mascot .ms-earL.far  { opacity: clamp(0, calc(sin(var(--t)) * -1000), 1); }
.mascot .ms-earR.near { opacity: clamp(0, calc(sin(var(--t)) * -1000 + 1), 1); }
.mascot .ms-earR.far  { opacity: clamp(0, calc(sin(var(--t)) * 1000), 1); }
/* the badge is legible only once its ear faces the viewer */
.mascot .ms-earL .ms-badge { opacity: clamp(0, calc(sin(var(--t)) * 1.6 - .15), 1); }
.mascot .ms-earR .ms-badge { opacity: clamp(0, calc(sin(var(--t)) * -1.6 - .15), 1); }
/* the crown: at the pole, so it barely moves */
.mascot .ms-top { transform-origin: 32px 8px; transform: translateX(calc(2px * sin(var(--t)))); }
.mascot .ms-cap { transform-origin: 32px 12px; transform: translateX(calc(5px * sin(var(--t)))) scaleX(calc(.45 + .55 * abs(cos(var(--t))))); }

/* ---- the body ------------------------------------------------------------ */
.mascot .ms-torso { transform-origin: 32px 47px; transform: scaleX(calc(.6 + .4 * abs(cos(var(--t))))); }
/* hips at φ = ∓90, radius 7 */
.mascot .ms-legL { transform-origin: 25px 54px; transform: translateX(calc(7px * (1 - cos(var(--t))))); }
.mascot .ms-legR { transform-origin: 39px 54px; transform: translateX(calc(-7px * (1 - cos(var(--t))))); }

/* ---- the arms ------------------------------------------------------------ */
/* One joint. The shoulder is on the body (depth 0), the hand's target at
   (hx, hy, depth d) — declared as custom properties on the arm by rig.ts. The
   arm turns at the shoulder towards the projected target and that is all:
   its length is fixed, so the hand is always at the capsule's end and a
   target only says which way to point (the owner's rule against stretchy
   arms, and then against the elbow). */
.mascot .ms-arm {
  --dx: calc((var(--hx) - var(--sx)) * cos(var(--t)) + var(--d) * sin(var(--t)));
  --dy: calc(var(--hy) - var(--sy));
  transform: translateX(calc((var(--sx) - 32) * (cos(var(--t)) - 1) * 1px));
}
.mascot .ms-upper { transform: rotate(atan2(var(--dy), var(--dx))); }
/* whole-arm copies, like the ears: left shoulder z = sin t, right z = −sin t */
.mascot .ms-armL.far  { opacity: clamp(0, calc(sin(var(--t)) * -1000), 1); }
.mascot .ms-armL.near { opacity: clamp(0, calc(sin(var(--t)) * 1000 + 1), 1); }
.mascot .ms-armR.far  { opacity: clamp(0, calc(sin(var(--t)) * 1000), 1); }
.mascot .ms-armR.near { opacity: clamp(0, calc(sin(var(--t)) * -1000 + 1), 1); }

/* ---- what the hands hold ------------------------------------------------- */
/* An object with volume, projected obliquely: a horizontal plane is seen a
   little from above, y' = 49 + 0.4·d (nearer = lower on screen).
   base = horizontal plane d 3 (lap) → 11 (hinge), a little wider than the lid,
   its hinge-side lip an upright strip at d 11 · lid = upright plane at d 11,
   nearest the viewer, back cover towards us · end/side faces = (d, y) planes
   seen only from their side. */
.mascot .ms-prop  { opacity: clamp(0, calc(cos(var(--t)) * 6 + .5), 1); }
.mascot .ms-lid   { transform-origin: 32px 0; transform: translateX(calc(11px * sin(var(--t)))) scaleX(max(.04, cos(var(--t)))); }
.mascot .ms-deckF { transform-origin: 32px 0; transform: translateX(calc(11px * sin(var(--t)))) scaleX(max(.04, cos(var(--t)))); }
/* deck drawn in (x, d): matrix(a b c d tx ty) → x' = a·x + c·d + tx, y' = b·x + d·d + ty */
.mascot .ms-deck  { transform-origin: 0 0; transform: matrix(cos(var(--t)), 0, sin(var(--t)), .4, calc(32 - 32 * cos(var(--t))), 49); }
/* end faces in (d, v): left shows when sin t > 0, right when < 0 */
.mascot .ms-deckL { transform-origin: 0 0; transform: matrix(sin(var(--t)), .4, 0, 1, calc(32 - 10.5 * cos(var(--t))), 49); opacity: clamp(0, calc(sin(var(--t)) * 1000), 1); }
.mascot .ms-deckR { transform-origin: 0 0; transform: matrix(sin(var(--t)), .4, 0, 1, calc(32 + 10.5 * cos(var(--t))), 49); opacity: clamp(0, calc(sin(var(--t)) * -1000), 1); }
/* the lid's thickness (1.2 from d 11, towards the viewer) in (d, y); the lid is 9 either side of centre */
.mascot .ms-lidL  { transform-origin: 0 0; transform: matrix(sin(var(--t)), 0, 0, 1, calc(32 - 9 * cos(var(--t))), 0); opacity: clamp(0, calc(sin(var(--t)) * 1000), 1); }
.mascot .ms-lidR  { transform-origin: 0 0; transform: matrix(sin(var(--t)), 0, 0, 1, calc(32 + 9 * cos(var(--t))), 0); opacity: clamp(0, calc(sin(var(--t)) * -1000), 1); }
/* a sheet of paper is a plane at d 8 */
.mascot .ms-sheet { transform-origin: 32px 0; transform: translateX(calc(8px * sin(var(--t)))) scaleX(max(.06, cos(var(--t)))); }

/* ---- alive --------------------------------------------------------------- */
/* Every looping motion starts at --ms-phase, which Mascot.svelte sets to minus
   the time it drew the markup: a redraw (a new pose) then picks the loop up
   where the last drawing left it instead of snapping back to its first frame. */
.mascot .ms-all { transform-origin: 32px 58px; animation: ms-breathe 3.6s ease-in-out var(--ms-phase, 0s) infinite; }
@keyframes ms-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.008, 1.018); } }
/* Blink off the name (Mascot.svelte sets --ms-blink), never on the beat:
   eight of these blinking together would read as one animation. */
.mascot .ms-blink { transform-box: fill-box; transform-origin: center; animation: ms-blink var(--ms-blink, 5.2s) var(--ms-phase, 0s) infinite; }
@keyframes ms-blink { 0%, 95.5%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
.mascot .ms-orb { transform-box: fill-box; transform-origin: center; animation: ms-pulse 2.8s ease-in-out var(--ms-phase, 0s) infinite; }
@keyframes ms-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .62; } }
.mascot .ms-float { transform-box: fill-box; transform-origin: center; animation: ms-float 2.4s ease-in-out var(--ms-phase, 0s) infinite; }
@keyframes ms-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
/* The one that sits on the screen does not turn to follow the pointer (owner:
   "ขยับไปขยับมา ไม่ต้องหันซ้ายขวา") — it sways instead, slowly, on top of its
   breathing, so it is alive without ever looking at anything. */
.mascot.sway .ms-all { animation: ms-sway 5.6s ease-in-out var(--ms-phase, 0s) infinite; }
@keyframes ms-sway {
  0%, 100% { transform: rotate(-1.4deg) scale(1, 1); }
  25% { transform: rotate(0deg) scale(1.006, 1.014); }
  50% { transform: rotate(1.4deg) scale(1, 1); }
  75% { transform: rotate(0deg) scale(1.006, 1.014); }
}
/* clicked: one small hop on top of whatever it is doing (Companion.svelte) */
.mascot.hop .ms-all { animation: ms-hop .55s cubic-bezier(.3, .9, .3, 1.2); }
@keyframes ms-hop { 0% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-4px) scale(.97, 1.05); } 60% { transform: translateY(0) scale(1.04, .96); } 100% { transform: translateY(0) scale(1, 1); } }
/* Smooth the change of pose (owner: "เวลามันเปลี่ยนบริบท ทำสมูท ๆ ไม่ใช่เด้งไป
   เด้งมาทันที"). Three things move between two poses and each is handled
   where it lives: the head turn is --t; the hands are the six targets below,
   set on the root by handVars() and read by the arms, so they swing there
   over the same time; and everything the markup itself changes — the face,
   the card, what is held — crossfades in Mascot.svelte, the old drawing
   over the new for a quarter second while the arms, shared by both, are
   already on their way. */
.mascot { position: relative; }
.mascot.settle { transition: --t .45s ease-out, --lhx .42s ease-in-out, --lhy .42s ease-in-out, --ld .42s ease-in-out, --rhx .42s ease-in-out, --rhy .42s ease-in-out, --rd .42s ease-in-out; }
@property --t { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --lhx { syntax: '<number>'; inherits: true; initial-value: 21.5; }
@property --lhy { syntax: '<number>'; inherits: true; initial-value: 52.5; }
@property --ld { syntax: '<number>'; inherits: true; initial-value: 11; }
@property --rhx { syntax: '<number>'; inherits: true; initial-value: 42.5; }
@property --rhy { syntax: '<number>'; inherits: true; initial-value: 52.5; }
@property --rd { syntax: '<number>'; inherits: true; initial-value: 11; }

/* ---- poses with motion of their own ------------------------------------- */
.mascot.pose-thinking .ms-eyes, .mascot.pose-asking .ms-eyes { animation: ms-dart 3.2s ease-in-out infinite; }
@keyframes ms-dart { 0%, 20%, 100% { transform: translate(0, 0); } 35%, 55% { transform: translate(1.6px, -.6px); } 70%, 85% { transform: translate(-1.2px, .2px); } }
.mascot.pose-typing .ms-orb, .mascot.pose-coding .ms-orb, .mascot.pose-searchData .ms-orb { animation: ms-tick 1.1s steps(2) infinite; }
@keyframes ms-tick { 0% { opacity: 1; } 100% { opacity: .55; } }
.mascot.pose-greeting .ms-armR .ms-palm { transform-box: fill-box; transform-origin: 30% 100%; animation: ms-wave .7s ease-in-out infinite alternate; }
@keyframes ms-wave { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
.mascot.pose-typing .ms-armL .ms-palm, .mascot.pose-coding .ms-armL .ms-palm, .mascot.pose-searchData .ms-armL .ms-palm { animation: ms-type .18s steps(2) infinite; }
.mascot.pose-typing .ms-armR .ms-palm, .mascot.pose-coding .ms-armR .ms-palm, .mascot.pose-searchData .ms-armR .ms-palm { animation: ms-type .18s steps(2) .09s infinite; }
@keyframes ms-type { 0% { transform: translateY(0); } 100% { transform: translateY(-.9px); } }
/* walking: legs alternate, the body bobs, the arms swing about the shoulder */
.mascot.pose-walk .ms-legL { animation: ms-stepL .62s ease-in-out infinite; }
.mascot.pose-walk .ms-legR { animation: ms-stepR .62s ease-in-out infinite; }
@keyframes ms-stepL { 0%, 100% { transform: translateX(calc(7px * (1 - cos(var(--t))))) translate(-2.2px, 0); } 50% { transform: translateX(calc(7px * (1 - cos(var(--t))))) translate(2.2px, -1.6px); } }
@keyframes ms-stepR { 0%, 100% { transform: translateX(calc(-7px * (1 - cos(var(--t))))) translate(2.2px, -1.6px); } 50% { transform: translateX(calc(-7px * (1 - cos(var(--t))))) translate(-2.2px, 0); } }
.mascot.pose-walk .ms-all { animation: ms-bob .31s ease-in-out infinite; }
@keyframes ms-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.1px); } }
.mascot.pose-walk .ms-armL { animation: ms-swingL .62s ease-in-out infinite; }
.mascot.pose-walk .ms-armR { animation: ms-swingR .62s ease-in-out infinite; }
@keyframes ms-swingL { 0%, 100% { transform: translateX(calc((var(--sx) - 32) * (cos(var(--t)) - 1) * 1px)) rotate(14deg); } 50% { transform: translateX(calc((var(--sx) - 32) * (cos(var(--t)) - 1) * 1px)) rotate(-14deg); } }
@keyframes ms-swingR { 0%, 100% { transform: translateX(calc((var(--sx) - 32) * (cos(var(--t)) - 1) * 1px)) rotate(-14deg); } 50% { transform: translateX(calc((var(--sx) - 32) * (cos(var(--t)) - 1) * 1px)) rotate(14deg); } }
/* resting: the whole body lies back on its charger and breathes slower */
.mascot.pose-recharge .ms-all { transform: rotate(-24deg) translate(-3px, 5px); animation: ms-snore 3.2s ease-in-out var(--ms-phase, 0s) infinite; }
@keyframes ms-snore { 0%, 100% { transform: rotate(-24deg) translate(-3px, 5px) scale(1, 1); } 50% { transform: rotate(-24deg) translate(-3px, 5px) scale(1.01, 1.025); } }
.mascot.pose-recharge .ms-blink { animation: none; }

/* out of service (an agent the assistant may not hand work to): the same drain the cartoon faces used */
.mascot.off { filter: saturate(.2) brightness(.72); }

/* ---- what may move, at which size ------------------------------------------
   Motion is paid per frame per mascot, and SVG cannot hand it to the GPU.
   A picker of twenty-five (ตั้งค่า › อวตาร) breathing, pulsing and floating
   together was a page that stuttered (owner, 12 ก.ย.). So: `still` moves
   nothing — a cell in a picker, a tile in a roster — and `lite` (under the
   detail size, set by Mascot.svelte) keeps only the blink, the one motion
   that reads at 20px. */
.mascot.still * { animation: none !important; }
.mascot.lite .ms-all, .mascot.lite .ms-orb, .mascot.lite .ms-float, .mascot.lite .ms-eyes { animation: none !important; }

@media (prefers-reduced-motion: reduce) {
  .mascot * { animation: none !important; }
  .mascot.settle { transition: none; }
}

html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
.wrap { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 12px; gap: 10px; }
.say { position: relative; max-width: 260px; background: #f5f8ff; color: #1a2233; border-radius: 12px; padding: 8px 11px; box-shadow: 0 6px 18px rgb(0 0 0 / .35); margin-bottom: 30px; overflow-wrap: anywhere; }
.say::after { content: ''; position: absolute; right: -6px; bottom: 12px; width: 12px; height: 12px; background: #f5f8ff; transform: rotate(45deg); border-radius: 2px; }
.say[hidden] { display: none; }
.off { opacity: .35; }
</style>

<div class="wrap"><div class="say" id="say" hidden></div><div id="fig"></div></div>
<script type="module">
