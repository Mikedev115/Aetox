<!-- Ecosystem. One thing in the middle and everything that touches it around
     the outside. The message is "how much this is connected to", so the centre
     has to look like the centre: it is the only shape with the accent on it.

     Not architecture, whose lines are directional and mean data moving through
     in an order. Here the lines mean "related", nothing more, so they carry no
     arrowheads — an arrow on a relationship line is a claim about direction
     that the slide is not making.

     Five or six satellites. Four leaves the ring looking accidental, seven
     makes every label smaller than the gap between them. -->
<style>
  .l-eco .diagram{ margin-top:26px }
  .l-eco .lbl{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:18px; fill:var(--text) }
  .l-eco .sub{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:13px; fill:var(--muted) }
  .l-eco .core{ font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif; font-size:24px; fill:var(--text) }
</style>
