<!-- Flow. Steps with a decision in them. The diamond is the whole reason to
     use this instead of process-steps or timeline: those two draw one path,
     and if there is genuinely only one path they are the better drawing.

     One decision per slide. Two diamonds means two questions, and a slide that
     asks two questions is answered by neither of the paths on it.

     Label both branches. An unlabelled fork is read as "and then somehow", and
     the "ไม่" branch is the one the audience is actually worried about. -->
<style>
  .l-decide .diagram{ margin-top:26px }
  .l-decide .lbl{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:18px; fill:var(--text) }
  .l-decide .ask{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:18px; fill:var(--text) }
  .l-decide .yn{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:14px;
                 fill:var(--accent-text,var(--accent)) }
</style>

<section class="slide l-decide">
  <div class="kicker rise">ทางเดินของงาน</div>
  <h1 class="rise" style="font-size:50px">ถึงตรงนี้แล้วแยกสองทาง</h1>
  <svg class="diagram rise" viewBox="0 0 1040 356" width="1040" height="356">
    <defs>
      <marker id="fl-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 Z" fill="var(--stroke,var(--line,rgba(255,255,255,.45)))"/>
      </marker>
    </defs>
    <g stroke="var(--stroke,var(--line,rgba(255,255,255,.45)))" stroke-width="2" fill="none" marker-end="url(#fl-arrow)">
      <line x1="188" y1="60" x2="292" y2="60"/>
      <line x1="470" y1="60" x2="530" y2="60"/>
      <path d="M790 60 L860 60 L860 146"/>
      <path d="M660 108 L660 296 L560 296"/>
      <path d="M292 296 L236 296 L236 130 L381 130 L381 90"/>
    </g>

    <rect x="20" y="30" width="168" height="60" rx="12" fill="none" stroke="var(--stroke,var(--line,rgba(255,255,255,.45)))" stroke-width="2"/>
    <text x="104" y="66" text-anchor="middle" class="lbl">รับคำขอ</text>

    <rect x="292" y="30" width="178" height="60" rx="12" fill="none" stroke="var(--stroke,var(--line,rgba(255,255,255,.45)))" stroke-width="2"/>
    <text x="381" y="66" text-anchor="middle" class="lbl">ตรวจข้อมูล</text>

    <path d="M660 12 L790 60 L660 108 L530 60 Z" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="660" y="66" text-anchor="middle" class="ask">ครบไหม</text>

    <text x="800" y="48" class="yn">ครบ</text>
    <text x="672" y="200" class="yn">ไม่ครบ</text>

    <rect x="760" y="146" width="200" height="60" rx="12" fill="none" stroke="var(--stroke,var(--line,rgba(255,255,255,.45)))" stroke-width="2"/>
    <text x="860" y="182" text-anchor="middle" class="lbl">อนุมัติ ปิดงาน</text>

    <rect x="292" y="266" width="268" height="60" rx="12" fill="none" stroke="var(--stroke,var(--line,rgba(255,255,255,.45)))" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="426" y="302" text-anchor="middle" class="lbl">ส่งกลับไปขอเพิ่ม</text>
  </svg>
</section>
