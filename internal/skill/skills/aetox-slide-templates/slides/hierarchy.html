<!-- Hierarchy. Who reports to whom, or what contains what. The lines are
     right-angled and carry no arrowheads, because an org chart is not a flow —
     nothing travels down it.

     One root, three or four below it, and only one of those opened up. A chart
     that expands every branch to the same depth is an org chart nobody can
     read from the back of the room; expand the branch the talk is about and
     leave the others closed.

     If the boxes are things rather than people and the lines mean "sends data
     to", this is architecture, which draws the arrows this one refuses to. -->
<style>
  .l-tree .diagram{ margin-top:30px }
  .l-tree .n1{ font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif; font-size:21px; fill:var(--text) }
  .l-tree .n2{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:18px; fill:var(--text) }
  .l-tree .n3{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:16px; fill:var(--body) }
  .l-tree .cnt{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:13px; fill:var(--muted) }
</style>
