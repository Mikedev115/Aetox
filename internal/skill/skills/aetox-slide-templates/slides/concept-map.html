<!-- Concept map. One idea opened out into the ideas inside it, two levels
     deep. The second level is what makes it a concept map: stop at one level
     and this is ecosystem, which is a ring around a hub and answers a
     different question.

     Left to right, not radial. A radial map looks better and is read worse,
     because half the labels end up upside down and none of them line up.

     Three branches, two leaves each. The leaves are where the real content
     goes; a leaf that repeats its branch in other words is a leaf to cut. -->
<style>
  .l-cmap .diagram{ margin-top:22px }
  .l-cmap .root{ font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif; font-size:22px; fill:var(--text) }
  .l-cmap .mid{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:18px; fill:var(--text) }
  .l-cmap .leaf{ font-family:"Prompt","Leelawadee UI",Tahoma,sans-serif; font-size:16px; fill:var(--body) }
</style>
