<!-- Search box. A real <form role="search"> with input type="search", so a
     screen reader announces the landmark and a phone shows a "search" key
     instead of "go". The label is real, just visually hidden (.w-sr-only
     from page-shell), because a placeholder alone is not a label — it
     disappears the moment somebody types, same reasoning newsletter.html and
     form-card.html use for keeping their own labels visible.

     This is the control, not the index: wire the form's action/name (or a
     script) to whatever actually searches. Drop it above docs-page.html's
     nav rail, or into nav.html's bar next to the menu. -->
<style>
  .w-search{ display:flex; align-items:center; gap:8px; border:1px solid var(--line);
             border-radius:10px; padding:9px 12px; background:var(--bg) }
  .w-search svg{ flex:none; opacity:.6 }
  .w-search input{ border:0; background:none; outline:0; width:100%; min-width:0;
                   font:400 15px/1.4 var(--sans); color:var(--text) }
  .w-search input::placeholder{ color:var(--muted) }
  .w-search kbd{ flex:none; font:600 11px/1 var(--mono); color:var(--muted);
                border:1px solid var(--line); border-radius:5px; padding:4px 6px }
</style>

<form class="w-search" role="search" method="get" action="#">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="11" y1="11" x2="15" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <label class="w-sr-only" for="w-search-q">ค้นหาในเอกสาร</label>
  <input id="w-search-q" name="q" type="search" placeholder="ค้นหา...">
  <kbd aria-hidden="true">/</kbd>
</form>
