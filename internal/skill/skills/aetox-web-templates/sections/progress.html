<style>
  .w-prog {
    --gray-6: #868e96;
    --gray-8: #343a40;
    --gray-9: #212529;
    --radius-round: 1e5px;
    --shadow-5: 0 -1px 2px 0 hsl(var(--shadow-color)/var(--shadow-strength-3)),0 2px 1px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 5px 5px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 10px 10px -2px hsl(var(--shadow-color)/var(--shadow-strength-5)),0 20px 20px -2px hsl(var(--shadow-color)/var(--shadow-strength-6)),0 40px 40px -2px hsl(var(--shadow-color)/var(--shadow-strength-8));
    --shadow-color: 220 40% 2%;
    --shadow-strength: 10%;
    --shadow-strength-3: calc(var(--shadow-strength) + 2%);
    --shadow-strength-4: calc(var(--shadow-strength) + 3%);
    --shadow-strength-5: calc(var(--shadow-strength) + 4%);
    --shadow-strength-6: calc(var(--shadow-strength) + 5%);
    --shadow-strength-8: calc(var(--shadow-strength) + 7%);
    --size-3: 1rem;
    --size-4: 1.25rem;
    --size-6: 1.75rem;
    --size-content-2: 45ch;
    --surface-1: var(--gray-9);
    --surface-2: var(--gray-8);
    --surface-4: var(--gray-6);
  }


.w-prog progress {
  --_track: hsl(228 100% 90%);
  --_track-size: min(10px, 1ex);
  --_progress: hsl(228 100% 50%);
  --_radius: 1e3px;
  --_indeterminate-track: linear-gradient(to right,
    var(--_track) 45%,
    var(--_progress) 0%,
    var(--_progress) 55%,
    var(--_track) 0%
  );
  --_indeterminate-track-size: 225% 100%;
  --_indeterminate-track-animation: progress-loading 2s infinite ease;
  
  /*  reset  */
  appearance: none;
  border: none;
  
  /*  custom style  */
  position: relative;
  height: var(--_track-size);
  border-radius: var(--_radius);
  overflow: hidden;

  @media (prefers-color-scheme: dark) {
    --_track: hsl(228 20% 30%);
    --_progress: hsl(228 100% 75%);
  }

  &:focus-visible {
    outline-color: var(--_progress);
  }
  
  /*  Safari/Chromium  */
  &[value]::-webkit-progress-bar {
    background-color: var(--_track);
  }
  
  &[value]::-webkit-progress-value {
    background-color: var(--_progress);
    transition: inline-size .25s ease-out;
  }
  
  /*  Firefox  */
  &[value]::-moz-progress-bar {
    background-color: var(--_progress);
  }
  
  /*  indeterminate  */
  &:indeterminate::after {
    content: "";
    inset: 0;
    position: absolute;
    background: var(--_indeterminate-track);
    background-size: var(--_indeterminate-track-size);
    background-position: right; 
    animation: var(--_indeterminate-track-animation);
  }
  
  /*  indeterminate Safari  */
  &:indeterminate::-webkit-progress-bar {
    background: var(--_indeterminate-track);
    background-size: var(--_indeterminate-track-size);
    background-position: right; 
    animation: var(--_indeterminate-track-animation);
  }
  
  /*  indeterminate Firefox  */
  &:indeterminate::-moz-progress-bar {
    background: var(--_indeterminate-track);
    background-size: var(--_indeterminate-track-size);
    background-position: right; 
    animation: var(--_indeterminate-track-animation);
  }
  
  /*  complete  */
  &:not([max])[value="1"]::before,
  &[max="100"][value="100"]::before {
    content: "✓";
    
    position: absolute;
    inset-block: 0;
    inset-inline: auto 0;
    display: flex;
    align-items: center;
    padding-inline-end: max(calc(var(--_track-size) / 4), 3px);

    color: white;
    font-size: calc(var(--_track-size) / 1.25);
  }
}
@keyframes progress-loading {
  50% {
    background-position: left; 
  }
}
.w-prog .button-group {
  display: flex;
  flex-flow: row wrap;
  justify-content: center;
  gap: var(--size-3);
  padding: var(--size-4) var(--size-6);
}
.w-prog label {
  display: grid;
  place-items: center;
}
.w-prog .sr-only {
  clip: rect(1px, 1px, 1px, 1px);
  clip-path: inset(50%);
  height: 1px;
  width: 1px;
  margin: -1px;
  overflow: hidden;
  padding: 0;
  position: absolute;
}
.w-prog main {
  display: grid;
  gap: var(--size-3);
  text-align: center;
  min-block-size: 80vh;
  place-content: center;
}
.w-prog .card {
  display: grid;
  gap: var(--size-3);
  padding: var(--size-4) var(--size-6);
  max-inline-size: 80vw;
  background: white;
  border-radius: var(--radius-round);
  border: 1px solid var(--surface-2);
  box-shadow: var(--shadow-5);
  inline-size: var(--size-content-2);

  @media (prefers-color-scheme: dark) {
    background: var(--surface-2);
  }

  & progress {
    inline-size: 100%;
  }
}
.w-prog {
  display: grid;
  place-content: center;
}
.w-prog .github-corner {
  fill: var(--surface-4);
  color: var(--surface-1); 
  
  &:hover .octo-arm {
    animation: octocat-wave 560ms ease-in-out
  }

  & > svg {
    fill: inherit;
    stroke: inherit;
    position: absolute; 
    top: 0; 
    right: 0;
  }
}
@keyframes octocat-wave {
  0%,100% {
    transform: rotate(0)
  }
  20%,60% {
    transform: rotate(-25deg)
  }
  40%,80% {
    transform: rotate(10deg)
  }
}
</style>

<section class="w-section w-prog">
  <div class="w-wrap">
    <main id="loading-zone" aria-busy="true">
          <p>Loading Level</p>
          <div class="card">
            <label>
              <span class="sr-only">Loading progress</span>
              <progress 
                indeterminate 
                role="progressbar" 
                aria-describedby="loading-zone"
                tabindex="-1"
              >unknown</progress>
            </label>
          </div>
        </main>

        <div class="button-group">
          <button id="increase" onclick="increase()">Increase</button>
          <button id="decrease" onclick="decrease()">Decrease</button>
          <button id="complete" type="submit" onclick="complete()">Complete</button>
          <button id="reset" type="reset" onclick="reset()">Reset</button>
        </div>

  </div>
</section>
