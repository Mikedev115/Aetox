<!-- Breadcrumb. The path back up, for a page nested more than one level deep.
     A real <nav aria-label="เส้นทางหน้า"> around an <ol>, because the order is
     the meaning — same reasoning how-it-works.html uses for its <ol>. The
     current page is marked aria-current="page" and is not a link: it is
     where the user already is. Drop it at the top of docs-page.html's body,
     above the <h1>, on any page nested past the first level. -->
<style>
  .w-crumb ol{ display:flex; flex-wrap:wrap; align-items:center; gap:6px;
              font-size:14px; color:var(--muted) }
  .w-crumb li{ display:flex; align-items:center; gap:6px }
  .w-crumb li:not(:last-child)::after{ content:"/"; opacity:.5 }
  .w-crumb a{ text-decoration:none; color:var(--muted) }
  .w-crumb a:hover{ color:var(--text); text-decoration:underline }
  .w-crumb [aria-current="page"]{ color:var(--text) }
</style>

<nav class="w-crumb" aria-label="เส้นทางหน้า">
  <ol>
    <li><a href="#">ตั้งค่า</a></li>
    <li><a href="#">บัญชี</a></li>
    <li aria-current="page">ความปลอดภัย</li>
  </ol>
</nav>
