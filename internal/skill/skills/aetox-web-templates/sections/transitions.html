     ใช้ View Transitions API ของเบราว์เซอร์ มีทั้งแบบวงกลมขยายและแบบกวาด เบราว์เซอร์ที่ยังไม่รองรับจะเปลี่ยนหน้าแบบธรรมดา ไม่มีอะไรพัง

     ที่มา: gui-challenges ของ Adam Argyle (Apache License 2.0) โฟลเดอร์ `transitions`
     สำเนาอยู่ที่ third_party/gui-challenges พร้อมไฟล์ LICENSE และ ATTRIBUTION.md

     สิ่งที่เปลี่ยนจากต้นฉบับ ตามข้อผูกพันของ Apache 2.0 ที่ต้องระบุการแก้ไข:
     1. ต้นฉบับใช้ at-import ดึง open-props/style ซึ่งดึงจาก npm — ไฟล์นี้เปิดจากดิสก์
        ต้องรันได้ จึงไล่หาตัวแปรที่โค้ดนี้ใช้จริง 0 ตัว (ไล่ซ้ำจนครบสายโซ่
        ที่ตัวแปรอ้างตัวแปรต่อกัน) แล้วฝังมาเฉพาะที่ใช้ ไม่ได้ยกมาทั้ง 607 ตัว
        Open Props เป็น MIT ของผู้เขียนคนเดียวกัน สำเนาอยู่ที่ third_party/open-props
     2. คีย์เฟรมของ Open Props ที่อนิเมชันอ้างถึงอีก 0 ชุด ฝังมาด้วยด้วยเหตุผลเดียวกัน
     3. ครอบทุกกฎด้วยคลาสราก `.w-trans` ตามสัญญาของคลังนี้ สองเทมเพลตใน
        เอกสารเดียวกันจะได้เอื้อมถึงกันไม่ได้
     4. ตัดส่วนหัวและท้ายของหน้าเดโมเขาออก เหลือเฉพาะตัวคอมโพเนนต์ -->

}
.w-trans {
  --wipe-in:     inset(0 0 0 0);
  --wipe-bottom: inset(100% 0 0 0);

}
.w-trans .wipe-in {
  & > .box {
    clip-path: var(--wipe-bottom);
    background: no-repeat center / auto 75% url(https://web.dev/third_party/chrometober-2022/assets/chrometober_cover--dark.7266b69c.svg) #222;

    @media (--motionOK) {
      transition: clip-path 1s ease;
    }
  }

  &:is(:hover,:focus,:active) > .box {
    clip-path: var(--wipe-in);
  }
}
.w-trans .wipe-out {
  background: no-repeat center / 75% auto url(https://gui-challenges.web.app/svg-favicon/dist/assets/favicon.cb17c595.svg);

  & > .box {
    clip-path: var(--wipe-in);

    @media (--motionOK) {
      transition: clip-path 1s ease;
    }
  }

  &:is(:hover,:focus,:active) > .box {
    clip-path: var(--wipe-top);
  }
}
.w-trans .wipe-suprise {
  display: grid;
  grid: auto-flow 1fr / 1fr;

  & > .box {
    grid-area: 1 / 1;
    clip-path: var(--wipe-in);

    @media (--motionOK) {
      transition: clip-path .5s ease;
    }

    &:nth-child(2) {
      clip-path: var(--wipe-left);
      background: deeppink;
    }
  }

  &:is(:hover,:focus,:active) {
    & > .box {
      &:nth-child(1) {
        clip-path: var(--wipe-left);
      }
      &:nth-child(2) {
        clip-path: var(--wipe-in);
      }
    }
  }

}

.w-trans .github-corner {

      animation: octocat-wave 560ms ease-in-out
    }

      fill: inherit;
      stroke: inherit;
      position: absolute;

      right: 0;
    }
  }

    0%,100% {
      transform: rotate(0)
    }
    20%,60% {
      transform: rotate(-25deg)
    }
    40%,80% {
      transform: rotate(10deg)
    }
  }


}
