<!-- Multi-series line. สามชุดที่ต้องอยู่ในแกนเดียวกัน เพื่อเทียบทิศทางกัน

     ชื่อชุดติดปลายเส้น ไม่ใช่อยู่แต่ใน legend เพราะ legend บังคับให้สายตากวาด
     ไปจำสี แล้วกวาดกลับมาหาเส้น ทุกครั้งที่อยากรู้ว่าเส้นไหนคืออะไร มี legend
     ไว้ด้วยสำหรับจอแคบที่ป้ายปลายเส้นไม่พอที่

     ห้ามมีแกนที่สอง เด็ดขาด สองหน่วยที่คนละสเกลคือสองกราฟ หรือทำเป็นดัชนี
     ฐานเดียวกันแล้วค่อยเอามาซ้อน กราฟสองแกนคือกราฟที่ทำให้เห็นความสัมพันธ์
     ที่ไม่มีอยู่จริง แค่เลื่อนสเกลข้างหนึ่งความสัมพันธ์นั้นก็หายไป

     ทั้งสามชุดวัดด้วยหน่วยเดียวกัน (จำนวนคน) จึงอยู่แกนเดียวกันได้อย่างซื่อสัตย์ -->
<style>
  .w-lines .legend{ display:flex; flex-wrap:wrap; gap:10px 20px; margin-top:14px; font-size:13.5px }
  .w-lines .legend span{ display:inline-flex; align-items:center; gap:8px; color:var(--muted) }
  .w-lines .legend i{ width:14px; height:3px; border-radius:2px; background:var(--k) }
  .w-lines figure{ margin-top:20px }
  .w-lines svg{ display:block; width:100%; height:auto; overflow:visible }
  .w-lines .gridline{ stroke:var(--line); stroke-width:1 }
  .w-lines .axis{ stroke:var(--line); stroke-width:1 }
  .w-lines .tick{ font-family:var(--mono); font-size:12px; fill:var(--muted) }
  .w-lines .endlabel{ font-size:13px; fill:var(--text); font-weight:500 }
  .w-lines details{ margin-top:20px; border:1px solid var(--line); border-radius:var(--radius) }
  .w-lines summary{ cursor:pointer; padding:12px 16px; font-size:14px; font-weight:500 }
  .w-lines .scroll{ overflow-x:auto; padding:0 16px 16px }
  .w-lines table{ width:100%; border-collapse:collapse; font-size:13.5px }
  .w-lines th,.w-lines td{ text-align:start; padding:8px 12px; border-top:1px solid var(--line); white-space:nowrap }
  .w-lines td{ font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted) }
  .w-lines th{ font-weight:500 }
  @media (max-width:640px){ .w-lines .endlabel{ display:none } }
</style>

<section class="w-section w-lines" aria-labelledby="lines-title">

    <p class="w-eyebrow">ผู้ใช้งาน · หกเดือน</p>
    <h2 id="lines-title" style="font-size:clamp(24px,3vw,32px);letter-spacing:-.025em;margin-top:6px">คนใหม่แซงคนที่เลิกใช้ตั้งแต่เดือนมีนาคม</h2>
    <p class="legend">
      <span style="--k:var(--viz-2,#2563eb)"><i></i>ผู้ใช้ใหม่</span>
      <span style="--k:var(--viz-3,#16a34a)"><i></i>กลับมาใช้ซ้ำ</span>
      <span style="--k:var(--viz-1,#db2777)"><i></i>เลิกใช้</span>
    </p>

    <figure>

        <g class="gridline"><path d="M62 40h700M62 100h700M62 160h700M62 220h700"/></g>
        <g class="tick" text-anchor="end">
          <text x="52" y="44">5,000</text><text x="52" y="104">3,750</text>
          <text x="52" y="164">2,500</text><text x="52" y="224">1,250</text>
        </g>

        <polyline fill="none" stroke="var(--viz-2,#2563eb)" stroke-width="2.5" stroke-linejoin="round"
                  points="90,224 224,196 358,168 492,120 626,100 760,58"/>
        <polyline fill="none" stroke="var(--viz-3,#16a34a)" stroke-width="2.5" stroke-linejoin="round"
                  points="90,244 224,236 358,204 492,212 626,172 760,148"/>
        <polyline fill="none" stroke="var(--viz-1,#db2777)" stroke-width="2.5" stroke-linejoin="round"
                  points="90,156 224,180 358,196 492,192 626,224 760,244"/>

        <g stroke="var(--bg)" stroke-width="2">
          <circle cx="760" cy="58" r="6" fill="var(--viz-2,#2563eb)"><title>มิ.ย. ผู้ใช้ใหม่ 4,100 คน</title></circle>
          <circle cx="760" cy="148" r="6" fill="var(--viz-3,#16a34a)"><title>มิ.ย. กลับมาใช้ซ้ำ 2,850 คน</title></circle>
          <circle cx="760" cy="244" r="6" fill="var(--viz-1,#db2777)"><title>มิ.ย. เลิกใช้ 900 คน</title></circle>
        </g>
        <g class="endlabel">
          <text x="776" y="62">ผู้ใช้ใหม่ 4,100</text>
          <text x="776" y="152">กลับมาใช้ซ้ำ 2,850</text>
          <text x="776" y="248">เลิกใช้ 900</text>
        </g>

        <path class="axis" d="M62 268h700"/>
        <g class="tick" text-anchor="middle">
          <text x="90" y="292">ม.ค.</text><text x="224" y="292">ก.พ.</text><text x="358" y="292">มี.ค.</text>
          <text x="492" y="292">เม.ย.</text><text x="626" y="292">พ.ค.</text><text x="760" y="292">มิ.ย.</text>
        </g>
      </svg>
    </figure>

    <details>

      <div class="scroll">
        <table>
          <caption class="w-sr-only">จำนวนผู้ใช้รายเดือน</caption>
          <thead><tr><th scope="col">เดือน</th><th scope="col">ผู้ใช้ใหม่</th><th scope="col">กลับมาใช้ซ้ำ</th><th scope="col">เลิกใช้</th></tr></thead>
          <tbody>
            <tr><th scope="row">ม.ค.</th><td>1,200</td><td>780</td><td>2,600</td></tr>
            <tr><th scope="row">ก.พ.</th><td>1,750</td><td>950</td><td>2,100</td></tr>

            <tr><th scope="row">พ.ค.</th><td>3,750</td><td>2,250</td><td>1,170</td></tr>

          </tbody>
        </table>
      </div>
    </details>

  </div>
</section>
