<!-- Card stack. การ์ดซ้อนที่กางออกตอนชี้

     ใช้โชว์ของหลายชิ้นในที่แคบ เช่นผลงานหรือไฟล์แนบ

     ที่มา: gui-challenges ของ Adam Argyle (Apache License 2.0) โฟลเดอร์ `card-stack`
     สำเนาอยู่ที่ third_party/gui-challenges พร้อมไฟล์ LICENSE และ ATTRIBUTION.md

     สิ่งที่เปลี่ยนจากต้นฉบับ ตามข้อผูกพันของ Apache 2.0 ที่ต้องระบุการแก้ไข:
     1. ต้นฉบับใช้ at-import ดึง open-props/style ซึ่งดึงจาก npm — ไฟล์นี้เปิดจากดิสก์
        ต้องรันได้ จึงไล่หาตัวแปรที่โค้ดนี้ใช้จริง 20 ตัว (ไล่ซ้ำจนครบสายโซ่
        ที่ตัวแปรอ้างตัวแปรต่อกัน) แล้วฝังมาเฉพาะที่ใช้ ไม่ได้ยกมาทั้ง 607 ตัว
        Open Props เป็น MIT ของผู้เขียนคนเดียวกัน สำเนาอยู่ที่ third_party/open-props
     2. คีย์เฟรมของ Open Props ที่อนิเมชันอ้างถึงอีก 0 ชุด ฝังมาด้วยด้วยเหตุผลเดียวกัน
     3. ครอบทุกกฎด้วยคลาสราก `.w-cardstack` ตามสัญญาของคลังนี้ สองเทมเพลตใน
        เอกสารเดียวกันจะได้เอื้อมถึงกันไม่ได้
     4. ตัดส่วนหัวและท้ายของหน้าเดโมเขาออก เหลือเฉพาะตัวคอมโพเนนต์ -->
<style>
  .w-cardstack {
    --blue-5: #339af0;
    --ease-elastic-in-out-4: cubic-bezier(.5,-.7,.1,1.5);
    --ease-in-out-3: cubic-bezier(.5,0,.5,1);
    --ease-squish-4: var(--ease-elastic-in-out-4);
    --gray-8: #343a40;
    --indigo-5: #5c7cfa;
    --radius-4: 2rem;
    --ratio-portrait: 3/4;
    --shadow-3: 0 -1px 3px 0 hsl(var(--shadow-color)/var(--shadow-strength-3)),0 1px 2px -5px hsl(var(--shadow-color)/var(--shadow-strength-3)),0 2px 5px -5px hsl(var(--shadow-color)/var(--shadow-strength-5)),0 4px 12px -5px hsl(var(--shadow-color)/var(--shadow-strength-6)),0 12px 15px -5px hsl(var(--shadow-color)/var(--shadow-strength-8));
    --shadow-color: 220 40% 2%;
    --shadow-strength: 10%;
    --shadow-strength-3: calc(var(--shadow-strength) + 2%);
    --shadow-strength-5: calc(var(--shadow-strength) + 4%);
    --shadow-strength-6: calc(var(--shadow-strength) + 5%);
    --shadow-strength-8: calc(var(--shadow-strength) + 7%);
    --size-3: 1rem;
    --size-5: 1.5rem;
    --surface-2: var(--gray-8);
    --teal-5: #20c997;
    --violet-5: #845ef7;
  }


.w-cardstack .card-stack {
  justify-self: start;
  display: grid;
  grid: [gui] 1fr / [challenges] min(50vmin, 40ch);
}
.w-cardstack .card {
  --better-bottom-left: -25% 125%;
  --better-bottom-center: center 200%;
  --better-bottom-right: 125% 125%;
  --better-top-left: -25% -25%;
  --better-top-center: center -200%;
  --better-top-right: 125% -25%;

  grid-area: gui / challenges;
  transform: rotate(var(--r, 0deg)) translateY(var(--t, 0px));
  /* transition: 
    transform-origin .5s var(--ease-squish-4),
    translate .25s var(--ease-in-out-3),
    rotate .5s var(--ease-squish-4); */
  transition: 
    transform-origin .5s var(--ease-squish-4),
    transform .25s var(--ease-in-out-3);
}
.w-cardstack .card:hover {
  /* translate: 0 -50px; */
  --t: -50px;
}
.w-cardstack .card:nth-of-type(5) { --r: 0deg }
.w-cardstack .card:nth-of-type(4) { --r: calc(var(--scalar, 5) * 1deg) }
.w-cardstack .card:nth-of-type(3) { --r: calc(var(--scalar, 5) * 1deg * -1) }
.w-cardstack .card:nth-of-type(2) { --r: calc(var(--scalar, 5) * 2 * 1deg) }
.w-cardstack .card:nth-of-type(1) { --r: calc(var(--scalar, 5) * 2 * 1deg * -1) }
.w-cardstack /*  radio states  */
html:has(#mode-bottom-left:checked) .card-stack > .card {
  transform-origin: bottom left;
}
.w-cardstack :has(#mode-top-left:checked) .card-stack > .card {
  transform-origin: top left;
}
.w-cardstack :has(#mode-top-right:checked) .card-stack > .card {
  transform-origin: top right;
}
.w-cardstack :has(#mode-bottom-right:checked) .card-stack > .card {
  transform-origin: bottom right;
}
.w-cardstack :has(#mode-bottom-center:checked) .card-stack > .card {
  transform-origin: bottom center;
}
.w-cardstack :has(#mode-better-bottom-center:checked) .card-stack > .card {
  transform-origin: var(--better-bottom-center);
}
.w-cardstack :has(#mode-better-top-left:checked) .card-stack > .card {
  transform-origin: var(--better-top-left);
}
.w-cardstack :has(#mode-center:checked) .card-stack > .card {
  transform-origin: center;
}
.w-cardstack :has(#mode-bett:checked) .card-stack > .card {
  transform-origin: var(--better-top-center);
}
@layer design.system, demo.support;

@layer demo.support {
.w-cardstack {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    place-items: center;
    padding: var(--size-5);
    gap: var(--size-5);
    overflow: hidden;
  }
.w-cardstack .card {
    aspect-ratio: var(--ratio-portrait);
    background: var(--surface-2);
    border-radius: var(--radius-4);
    box-shadow: var(--shadow-3);
  }
.w-cardstack .card:nth-of-type(5) { background: var(--indigo-5) }
.w-cardstack .card:nth-of-type(4) { background: var(--grape-5) }
.w-cardstack .card:nth-of-type(3) { background: var(--violet-5) }
.w-cardstack .card:nth-of-type(2) { background: var(--blue-5) }
.w-cardstack .card:nth-of-type(1) { background: var(--teal-5) }
.w-cardstack fieldset {
    display: grid;
    gap: var(--size-3);
  }
.w-cardstack fieldset > label {
    grid-column: 2;
  }
.w-cardstack form {
    display: grid;
    gap: var(--size-3);
    justify-items: start;
  }
.w-cardstack input[type="radio"] {
    inline-size: auto;
    block-size: auto;
  }


}
@keyframes octocat-wave {
  0%,100% {
    transform: rotate(0)
  }
  20%,60% {
    transform: rotate(-25deg)
  }
  40%,80% {
    transform: rotate(10deg)
  }
}
</style>

<section class="w-section w-cardstack">
  <div class="w-wrap">
    <form>
          <fieldset>
            <legend>Transform Origin</legend>
            <input type="radio" id="mode-center" name="stack-type" checked>
            <label for="mode-center">center</label>
            <input type="radio" id="mode-bottom-center" name="stack-type">
            <label for="mode-bottom-center">bottom center</label>
            <input type="radio" id="mode-bottom-left" name="stack-type">
            <label for="mode-bottom-left">bottom left</label>
            <input type="radio" id="mode-top-left" name="stack-type">
            <label for="mode-top-left">top left</label>
            <input type="radio" id="mode-top-right" name="stack-type">
            <label for="mode-top-right">top right</label>
            <input type="radio" id="mode-bottom-right" name="stack-type">
            <label for="mode-bottom-right">bottom right</label>
          </fieldset>
          <fieldset>
            <legend>Custom</legend>
            <input type="radio" id="mode-better-bottom-center" name="stack-type">
            <label for="mode-better-bottom-center">center 200%</label>
            <input type="radio" id="mode-better-top-left" name="stack-type">
            <label for="mode-better-top-left">-25% -25%</label>
          </fieldset>
          <fieldset>
            <legend>Gap</legend>
            <input id="slider" type="range" min="0" max="20" value="5">
          </fieldset>
        </form>

        <div class="card-stack">
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
        </div>

        <a href="https://github.com/argyleink/gui-challenges" class="github-corner" aria-label="View source on GitHub" style="position: absolute; top: 0; border: 0; right: 0;">

          </svg>
        </a>
  </div>
