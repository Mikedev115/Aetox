<!-- Page shell. The document every section below drops into: tokens, reset,
     landmarks, light and dark. Paste this first, then sections into <main>.

     Everything is in one file on purpose, the same reason a deck is: the page
     opens from disk, from a USB stick, from an email attachment, with no build
     step and no server. -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชื่อหน้า</title>
<meta name="description" content="ประโยคเดียวที่บอกว่าหน้านี้เกี่ยวกับอะไร">
<style>
  :root{
    color-scheme:light dark;
    --bg:#ffffff; --surface:#f6f7f9; --text:#0d1117; --muted:#5b6472;
    --line:#e3e6ea; --accent:#c8321f; --accent-ink:#ffffff;
    --success:#1a7f4b; --warning:#8a5a00; --danger:#b4291c;
    --radius:14px; --maxw:1120px; --gap:clamp(16px,2.5vw,28px);
    --pad:clamp(20px,5vw,48px);
    --sans:"Prompt","Leelawadee UI",system-ui,-apple-system,Segoe UI,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
    /* สีสำหรับข้อมูล แยกจากสีสถานะข้างบนโดยตั้งใจ: สถานะบอกว่าเรื่องนี้ดีหรือแย่
       ข้อมูลบอกแค่ว่านี่คนละชุดกับชุดนั้น ปนกันเมื่อไหร่กราฟจะพูดสิ่งที่ไม่ได้
       ตั้งใจพูด ลำดับตายตัว ห้ามวนกลับ ชุดที่เจ็ดคือรวมเป็น "อื่น ๆ" ไม่ใช่สร้าง
       สีใหม่ ทั้งหกค่านี้รันผ่าน validator ของสกิล dataviz แล้วทั้งสองโหมด —
       แถบความสว่าง ความอิ่มสี ระยะห่างของคู่ที่ติดกันเมื่อมองด้วยตาบอดสี และ
       คอนทราสต์กับพื้น ถ้าจะเปลี่ยนค่า ให้รัน validator ใหม่ อย่ากะด้วยตา */
    --viz-1:#db2777; --viz-2:#2563eb; --viz-3:#16a34a;
    --viz-4:#7c3aed; --viz-5:#d97706; --viz-6:#0d9488;
    /* ไล่เฉดสีเดียวสำหรับปริมาณ อ่อนไปเข้ม ไม่ใช่รุ้ง */
    --viz-s1:#dbeafe; --viz-s2:#bfdbfe; --viz-s3:#93b4f7;
    --viz-s4:#4f83ee; --viz-s5:#1d4ed8;
    /* ขึ้นกับลง เป็นสถานะ ไม่ใช่ชุดข้อมูล จึงยืมจาก success/danger */
    --viz-up:var(--success); --viz-down:var(--danger);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){ color-scheme:dark;
           --bg:#0c0e12; --surface:#14171d; --text:#f2f4f7; --muted:#98a1b0;
           --line:#232830; --accent:#ff5a45; --accent-ink:#0c0e12;
           --success:#4fd18b; --warning:#ffb648; --danger:#ff7a68;
           --viz-1:#e0538f; --viz-2:#4f7fe8; --viz-3:#25a463;
           --viz-4:#8a6bea; --viz-5:#c1862c; --viz-6:#1ba38f;
           --viz-s1:#182a4a; --viz-s2:#1e3a6b; --viz-s3:#2a539b;
           --viz-s4:#3a6ecb; --viz-s5:#5b8cf7 }
  }
  /* Same values again, gated on an explicit choice rather than the OS
     setting: sections/theme-toggle.html flips this attribute and remembers
     it, for a page that wants a switch instead of only following the system. */
  :root[data-theme="light"]{ color-scheme:light }
  :root[data-theme="dark"]{ color-scheme:dark;
         --bg:#0c0e12; --surface:#14171d; --text:#f2f4f7; --muted:#98a1b0;
         --line:#232830; --accent:#ff5a45; --accent-ink:#0c0e12;
         --success:#4fd18b; --warning:#ffb648; --danger:#ff7a68;
         --viz-1:#e0538f; --viz-2:#4f7fe8; --viz-3:#25a463;
         --viz-4:#8a6bea; --viz-5:#c1862c; --viz-6:#1ba38f;
         --viz-s1:#182a4a; --viz-s2:#1e3a6b; --viz-s3:#2a539b;
         --viz-s4:#3a6ecb; --viz-s5:#5b8cf7 }
  *,*::before,*::after{ box-sizing:border-box }
  body,h1,h2,h3,h4,p,figure,blockquote,ul,ol,dl,dd{ margin:0 }
  /* Lists inside a w- component are structure, not prose, so they lose their
     markers. Scoped to the namespace rather than written as `ul[class]`: the
     lists in these templates are plain <ul> inside a classed parent, and the
     `ul[class]` idiom missed every one of them, which put bullet points down
     the middle of the nav and the logo row the first time it was rendered.
     Matched by prefix, not substring: `[class*="w-"]` alone would also catch
     an unrelated class like `show-panel` or `arrow-nav` (both contain "w-")
     and strip bullets from a list that has nothing to do with this skill. */
  :is([class^="w-"],[class*=" w-"]) :where(ul,ol){ list-style:none; padding:0 }
  /* Prose is the exception and asks for its markers back, because there a list
     IS the content. */
  .w-article .prose :where(ul,ol),.w-docs .body :where(ul,ol){
    list-style:revert; padding-left:1.3em }
  img,svg,video{ display:block; max-width:100%; height:auto }
  body{ background:var(--bg); color:var(--text); font-family:var(--sans);
        line-height:1.65; -webkit-font-smoothing:antialiased }
  a{ color:inherit }
  :where(a,button,input,textarea,select,summary):focus-visible{
    outline:2px solid var(--accent); outline-offset:3px; border-radius:6px }
  .w-wrap{ width:100%; max-width:var(--maxw); margin-inline:auto; padding-inline:var(--pad) }
  .w-section{ padding-block:clamp(48px,8vw,104px) }
  .w-eyebrow{ color:var(--accent); font-weight:600; letter-spacing:.1em;
              text-transform:uppercase; font-size:13px }
  .w-lede{ color:var(--muted); font-size:clamp(16px,1.6vw,19px); max-width:62ch }
  .w-btn{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--accent);
          background:var(--accent); color:var(--accent-ink); text-decoration:none;
          font:600 16px/1 var(--sans); padding:14px 22px; border-radius:10px }
  .w-btn--ghost{ background:transparent; color:var(--text); border-color:var(--line) }
  /* For the rare label a sighted user does not need to see but a screen
     reader must have — a compact search box, an icon-only control. Stays in
     the tab order and the accessibility tree, unlike display:none. Prefer a
     visible label over this one first; most fields in this library use one. */
  .w-sr-only{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0; border:0;
    clip-path:inset(50%); overflow:hidden; white-space:nowrap;
  }
  .w-skip{ position:absolute; left:-9999px }
  .w-skip:focus{ left:12px; top:12px; z-index:99; background:var(--bg); padding:10px 14px }
  @media (prefers-reduced-motion:no-preference){
    html{ scroll-behavior:smooth }
  }
</style>
</head>
<body>
<a class="w-skip" href="#main">ข้ามไปเนื้อหา</a>
<!-- nav.html here -->
<main id="main">
  <!-- sections here -->
</main>
<!-- footer.html here -->
</body>
</html>
