<!-- Media grid. A grid of visual content — clips, recordings, screenshots,
     anything thumbnail-first — each card carrying its own preview, a
     type/duration badge, a byline, and a small count of reactions.

     Different from article-index.html: that one is read (title first, image
     optional), this one is opened or played (thumbnail first, title second).
     The badge is plain text with an aria-label, not an icon alone, so a
     screen reader gets "ความยาว 2 นาที 28 วินาที" instead of a bare "2:28". -->
<style>
  .w-media h2{ font-size:clamp(26px,3.4vw,40px); letter-spacing:-.02em }
  .w-media .grid{ display:grid; gap:var(--gap); margin-top:clamp(28px,4vw,44px);
                  grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)) }
  .w-media .card{ display:flex; flex-direction:column; gap:10px }
  .w-media .thumb{ position:relative; aspect-ratio:16/9; border-radius:var(--radius);
                   overflow:hidden; background:linear-gradient(135deg,var(--line),var(--surface)) }
  .w-media .badge{ position:absolute; left:8px; bottom:8px;
                   background:color-mix(in srgb,var(--text) 80%,transparent);
                   color:var(--bg); font:600 12px/1 var(--mono); padding:4px 7px; border-radius:5px }
  .w-media h3{ font-size:15px; line-height:1.35 }
  .w-media .byline{ display:flex; align-items:center; gap:8px; margin-top:2px }
  .w-media .av{ width:20px; height:20px; border-radius:50%; background:var(--surface);
               border:1px solid var(--line); flex:none }
  .w-media .who{ color:var(--muted); font-size:13px }
  .w-media .stats{ display:flex; gap:14px; color:var(--muted); font-size:12.5px;
                   font-family:var(--mono); margin-top:4px; font-variant-numeric:tabular-nums }
</style>

<section class="w-section w-media" id="media">
  <div class="w-wrap">
    <p class="w-eyebrow">ผลงาน</p>
    <h2>สิ่งที่อัปโหลดล่าสุด</h2>
    <div class="grid">
      <article class="card">
        <div class="thumb"><span class="badge" aria-label="ความยาว 2 นาที 28 วินาที">2:28</span></div>
        <div>
          <h3><a href="#">ชื่อชิ้นงานที่บอกว่ามันคืออะไร</a></h3>
          <div class="byline"><span class="av" aria-hidden="true"></span><span class="who">ชื่อผู้สร้าง</span></div>
          <p class="stats"><span>280 ดู</span><span>56 ถูกใจ</span><span>7 ความเห็น</span></p>
        </div>
      </article>
      <article class="card">
        <div class="thumb"><span class="badge" aria-label="ความยาว 1 นาที 52 วินาที">1:52</span></div>
        <div>
          <h3><a href="#">อีกชิ้นหนึ่ง</a></h3>
          <div class="byline"><span class="av" aria-hidden="true"></span><span class="who">ชื่อผู้สร้าง</span></div>
          <p class="stats"><span>641 ดู</span><span>27 ถูกใจ</span><span>3 ความเห็น</span></p>
        </div>
      </article>
      <article class="card">
        <div class="thumb"><span class="badge" aria-label="ความยาว 22 วินาที">0:22</span></div>
        <div>
          <h3><a href="#">ชิ้นที่สาม</a></h3>
          <div class="byline"><span class="av" aria-hidden="true"></span><span class="who">ชื่อผู้สร้าง</span></div>
          <p class="stats"><span>1.4K ดู</span><span>155 ถูกใจ</span><span>7 ความเห็น</span></p>
        </div>
      </article>
    </div>
  </div>
</section>
