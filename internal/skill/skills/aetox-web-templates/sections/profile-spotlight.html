<!-- Profile spotlight. One person's page: photo, a real bio in their own
     words, the ways to reach them, and the work that represents them best.

     Different from team.html: that one is a grid of many people scanned at a
     glance, this is one person read in full. Same rule as testimonial.html —
     if there is no real bio and no real way to reach them, there is no
     section, just a placeholder photo with a name under it. -->
<style>
  .w-spotlight .layout{ display:grid; gap:clamp(28px,4vw,48px);
                        grid-template-columns:minmax(200px,280px) 1fr; align-items:start }
  .w-spotlight .ph{ width:100%; aspect-ratio:1; border-radius:var(--radius);
                    background:var(--surface); border:1px solid var(--line) }
  .w-spotlight h2{ font-size:clamp(24px,3vw,34px); letter-spacing:-.02em }
  .w-spotlight .role{ color:var(--muted); margin-top:4px }
  .w-spotlight .bio{ margin-top:18px; color:var(--muted); font-size:16px; max-width:64ch; line-height:1.7 }
  .w-spotlight .links{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:20px }
  .w-spotlight .links a:not(.w-btn){ font-size:14px; color:var(--accent); border:1px solid var(--line);
                         border-radius:999px; padding:6px 14px; text-decoration:none }
  .w-spotlight .featured{ margin-top:30px }
  .w-spotlight .featured h3{ font-size:13px; letter-spacing:.06em; text-transform:uppercase;
                             color:var(--muted); margin-bottom:12px }
  .w-spotlight .featured .thumb{ aspect-ratio:16/9; border-radius:var(--radius);
                                 background:linear-gradient(135deg,var(--line),var(--surface)) }
  @media (max-width:640px){ .w-spotlight .layout{ grid-template-columns:1fr } }
</style>

<section class="w-section w-spotlight" id="spotlight">
  <div class="w-wrap layout">
    <div class="ph" aria-hidden="true"></div>
    <div>
      <p class="w-eyebrow">แนะนำ</p>
      <h2>ชื่อจริง</h2>
      <p class="role">ตำแหน่ง หรือสิ่งที่ทำ</p>
      <p class="bio">ย่อหน้าสั้นๆ ที่บอกว่าคนนี้เป็นใคร ทำอะไร มีจุดยืนแบบไหน เขียนด้วยเสียงของเขาเอง ไม่ใช่คำโฆษณาที่ระบบเขียนแทนให้</p>
      <div class="links">
        <a href="#">อีเมล</a>
        <a href="#">เว็บไซต์</a>
        <a class="w-btn" href="#">ติดตาม</a>
      </div>
      <div class="featured">
        <h3>ผลงานเด่น</h3>
        <div class="thumb" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</section>
