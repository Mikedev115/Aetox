<!-- Stacked bars. ยอดรวมโตขึ้นไหม และโตจากส่วนไหน — สองคำถามในกราฟเดียว

     ใช้ตอนที่องค์ประกอบสำคัญพอ ๆ กับผลรวม ถ้าสนใจแค่ผลรวมให้ใช้แท่งเดี่ยว
     ถ้าสนใจแค่การเทียบชุดต่อชุดให้ใช้ chart-multi-line.html เพราะชั้นที่ลอย
     อยู่กลางกองซ้อนนั้นเทียบข้ามเดือนยาก ฐานของมันขยับตลอด

     มีช่องว่างสีพื้น 2px คั่นทุกชั้น ชั้นจึงไม่กลืนกันตอนสีใกล้เคียง และมุมบน
     โค้งเฉพาะชั้นบนสุด เพราะนั่นคือปลายของแท่ง ไม่ใช่ปลายของทุกชั้น

     สามชุดคือเพดานที่อ่านสบาย เกินกว่านั้นให้รวมเป็น "อื่น ๆ" ชุดเดียว -->
<style>
  .w-stack .legend{ display:flex; flex-wrap:wrap; gap:10px 20px; margin-top:14px; font-size:13.5px }
  .w-stack .legend span{ display:inline-flex; align-items:center; gap:8px; color:var(--muted) }
  .w-stack .legend i{ width:11px; height:11px; border-radius:3px; background:var(--k) }
  .w-stack figure{ margin-top:20px }
  .w-stack svg{ display:block; width:100%; height:auto }
  .w-stack .gridline{ stroke:var(--line); stroke-width:1 }
  .w-stack .axis{ stroke:var(--line); stroke-width:1 }
  .w-stack .tick{ font-family:var(--mono); font-size:12px; fill:var(--muted) }
  .w-stack .total{ font-family:var(--mono); font-size:12px; fill:var(--text); font-weight:500 }
  .w-stack details{ margin-top:20px; border:1px solid var(--line); border-radius:var(--radius) }
  .w-stack summary{ cursor:pointer; padding:12px 16px; font-size:14px; font-weight:500 }
  .w-stack .scroll{ overflow-x:auto; padding:0 16px 16px }
  .w-stack table{ width:100%; border-collapse:collapse; font-size:13.5px }
  .w-stack th,.w-stack td{ text-align:start; padding:8px 12px; border-top:1px solid var(--line); white-space:nowrap }
  .w-stack td{ font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted) }
  .w-stack th{ font-weight:500 }
</style>
