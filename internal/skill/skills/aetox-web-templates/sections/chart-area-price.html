<!-- Area price chart. เส้นเดียวกับพื้นที่ใต้เส้น สำหรับคำถามเดียวคือ "ขึ้นหรือลง"

     ค่าล่าสุดติดป้ายไว้ที่ปลายเส้น ไม่ใช่ปล่อยให้ไล่หาในแกน เพราะค่าล่าสุดคือ
     สิ่งที่คนเปิดหน้านี้มาดู ส่วนแกนมีไว้ให้รู้ว่าตัวเลขนั้นอยู่ตรงไหนของช่วง

     ทุกจุดมี <title> ของตัวเอง เบราว์เซอร์จึงขึ้น tooltip ให้เองและ screen
     reader อ่านได้ โดยไม่ต้องมีสคริปต์สักบรรทัด ใต้กราฟมีตารางเดียวกันใน
     <details> สำหรับคนที่อ่านกราฟไม่ได้หรือไม่อยากอ่าน — กราฟที่ไม่มีทางออก
     เป็นตัวเลขคือกราฟที่ปิดประตูใส่คนอ่านครึ่งหนึ่ง

     สีมาจากโทเคน --viz-* ใน page-shell ค่าสำรองในวงเล็บมีไว้เผื่อไฟล์นี้ถูก
     ก๊อปไปวางในหน้าที่ไม่มี shell ไม่ใช่เพื่อให้ฝังสีไว้ในกฎ -->
<style>
  .w-area .head{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px 20px }
  .w-area h2{ font-size:clamp(30px,4vw,44px); letter-spacing:-.015em; line-height:1;
              font-variant-numeric:tabular-nums }
  .w-area .delta{ font-size:15px; font-weight:500; letter-spacing:0 }
  .w-area .delta.up{ color:var(--viz-up,var(--success)) }
  .w-area .delta.down{ color:var(--viz-down,var(--danger)) }
  .w-area .sub{ color:var(--muted); font-size:14.5px; margin-top:6px }
  .w-area .ranges{ margin-inline-start:auto; display:flex; gap:6px }
  .w-area .ranges a{ font:500 13px/1 var(--sans); color:var(--muted); text-decoration:none;
                     border:1px solid var(--line); border-radius:8px; padding:8px 12px }
  .w-area .ranges a[aria-current="true"]{ background:var(--text); color:var(--bg); border-color:var(--text) }
  .w-area figure{ margin-top:22px }
  .w-area svg{ display:block; width:100%; height:auto; overflow:visible }
  .w-area .gridline{ stroke:var(--line); stroke-width:1 }
  .w-area .axis{ stroke:var(--line); stroke-width:1 }
  .w-area .tick{ font-family:var(--mono); font-size:11px; fill:var(--muted) }
  .w-area .last{ font-family:var(--mono); font-size:12.5px; fill:var(--text); font-weight:500 }
  .w-area .dot{ fill:var(--viz-2,#2563eb); stroke:var(--bg); stroke-width:2 }
  .w-area figcaption{ color:var(--muted); font-size:12.5px; margin-top:10px }
  .w-area details{ margin-top:18px; border:1px solid var(--line); border-radius:var(--radius) }
  .w-area summary{ cursor:pointer; padding:12px 16px; font-size:14px; font-weight:500 }
  .w-area table{ width:100%; border-collapse:collapse; font-size:13.5px }
  .w-area .scroll{ overflow-x:auto; padding:0 16px 16px }
  .w-area th,.w-area td{ text-align:start; padding:8px 12px; border-top:1px solid var(--line);
                         white-space:nowrap }
  .w-area td{ font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--muted) }
  .w-area th{ font-weight:500 }
</style>
