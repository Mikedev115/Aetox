<!-- Switch group. กลุ่มสวิตช์ที่มีตัวควบคุมทั้งกลุ่ม

     สวิตช์แม่หนึ่งตัวคุมลูกทั้งกลุ่ม และแสดงสถานะกึ่งกลางเมื่อลูกเปิดบ้างปิดบ้าง

     ที่มา: gui-challenges ของ Adam Argyle (Apache License 2.0) โฟลเดอร์ `switch-group`
     สำเนาอยู่ที่ third_party/gui-challenges พร้อมไฟล์ LICENSE และ ATTRIBUTION.md

     สิ่งที่เปลี่ยนจากต้นฉบับ ตามข้อผูกพันของ Apache 2.0 ที่ต้องระบุการแก้ไข:
     1. ต้นฉบับใช้ at-import ดึง open-props/style ซึ่งดึงจาก npm — ไฟล์นี้เปิดจากดิสก์
        ต้องรันได้ จึงไล่หาตัวแปรที่โค้ดนี้ใช้จริง 23 ตัว (ไล่ซ้ำจนครบสายโซ่
        ที่ตัวแปรอ้างตัวแปรต่อกัน) แล้วฝังมาเฉพาะที่ใช้ ไม่ได้ยกมาทั้ง 607 ตัว
        Open Props เป็น MIT ของผู้เขียนคนเดียวกัน สำเนาอยู่ที่ third_party/open-props
     2. คีย์เฟรมของ Open Props ที่อนิเมชันอ้างถึงอีก 0 ชุด ฝังมาด้วยด้วยเหตุผลเดียวกัน
     3. ครอบทุกกฎด้วยคลาสราก `.w-switchgrp` ตามสัญญาของคลังนี้ สองเทมเพลตใน
        เอกสารเดียวกันจะได้เอื้อมถึงกันไม่ได้
     4. ตัดส่วนหัวและท้ายของหน้าเดโมเขาออก เหลือเฉพาะตัวคอมโพเนนต์ -->
<style>
  .w-switchgrp {
    --ease-elastic-in-out-3: cubic-bezier(.5,-.5,.1,1.5);
    --ease-squish-3: var(--ease-elastic-in-out-3);
    --gray-6: #868e96;
    --gray-8: #343a40;
    --gray-9: #212529;
    --indigo-3: #91a7ff;
    --link: var(--indigo-3);
    --radius-2: 5px;
    --shadow-2: 0 3px 5px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 7px 14px -5px hsl(var(--shadow-color)/var(--shadow-strength-6));
    --shadow-4: 0 -2px 5px 0 hsl(var(--shadow-color)/var(--shadow-strength-3)),0 1px 1px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 2px 2px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 5px 5px -2px hsl(var(--shadow-color)/var(--shadow-strength-5)),0 9px 9px -2px hsl(var(--shadow-color)/var(--shadow-strength-6)),0 16px 16px -2px hsl(var(--shadow-color)/var(--shadow-strength-7));
    --shadow-color: 220 40% 2%;
    --shadow-strength: 10%;
    --shadow-strength-3: calc(var(--shadow-strength) + 2%);
    --shadow-strength-4: calc(var(--shadow-strength) + 3%);
    --shadow-strength-5: calc(var(--shadow-strength) + 4%);
    --shadow-strength-6: calc(var(--shadow-strength) + 5%);
    --shadow-strength-7: calc(var(--shadow-strength) + 6%);
    --size-1: .25rem;
    --size-5: 1.5rem;
    --size-7: 2rem;
    --surface-1: var(--gray-9);
    --surface-2: var(--gray-8);
    --surface-4: var(--gray-6);
  }


.w-switchgrp .switch-group {
  /* inline layout with minor space between */
  display: flex;
  gap: var(--size-1);

  /* defensive against flex/grid stretching */
  max-inline-size: max-content;

  /* card surface should sit above background */
  background: var(--surface-1);
  padding: var(--size-1);
  border-radius: var(--radius-2);
  box-shadow: var(--shadow-2);

  /* remove fieldset border */
  border: none;

  /* animate box-shadow as it changes */
  transition: box-shadow .5s var(--ease-squish-3);

  /* change box-shadow when focus is inside */
  &:is(:focus-within, :hover) {
    box-shadow: var(--shadow-4);
  }

  /* legend is useful to AT's but not our visible UI */
  & > legend {
    visibility: hidden;
    block-size: 0;
  }
}
.w-switchgrp .group-switch {
  /* single cell grid, prepare for the pile */
  display: grid;
  place-items: center;
  padding: var(--size-1);

  /* sets width */
  inline-size: var(--size-7);

  /* soft corner */
  /* is considerate of being a nested radius */
  /* https://codepen.io/BrianCross/pen/KKmgmXb */
  border-radius: calc(var(--radius-2) * .5);

  @media (--motionOK) {
    transition: 
      outline-offset .3s ease,
      background-color .3s ease;
  }

  /* when not pressed via keyboard */
  /* has the side effect of creating an animation */
  /* because :active will be 0 offset */
  &:not(:has(:active)) {
    outline-offset: 2px;
  }

  /* if focus is showing and there's focus within */
  /* provide a nice outline style */
  &:has(:focus-visible):focus-within {
    outline: 1px solid var(--link);
  }

  /* if the radio inside is checked */
  /* this switch is selected */
  &:has(:checked) {
    color: var(--link);
  }

  & :checked ~ svg {
    color: var(--link);
  }

  /* stylish hover/selected background */
  &:has(:checked),
  &:hover {
    background: var(--surface-2);
  }

  /* all direct children pile into the single grid cell */
  & > :is(input, label, svg) {
    grid-area: 1/1;
    inline-size: 100%;
    block-size: 100%;
  }

  /* and dont just grow to fit, but max the size to fit */
  /* if not the SVG icon */
  /* content is there and interactive, just not visible */
  & > :is(input, label) {
    opacity: 0;
    overflow: hidden;
    white-space: nowrap;
  }

  /* icon color to follow the text color set on the switch parent */
  & > svg {
    fill: currentColor;
  }
}
@layer components.tooltip {
.w-switchgrp tool-tip {
    --_bg: var(--surface-1);
    --_shadow-alpha: 15%;
  }


}
@layer demo.support {
.w-switchgrp {
    --_surface-document: var(--surface-4);
    display: grid;
    place-content: center;
    padding: var(--size-5);
    gap: var(--size-5);
    background: var(--_surface-document);

    @media (--OSdark) {
      --_surface-document: var(--surface-2);
    }
  }


}
@keyframes octocat-wave {
  0%,100% {
    transform: rotate(0)
  }
  20%,60% {
    transform: rotate(-25deg)
  }
  40%,80% {
    transform: rotate(10deg)
  }
}
</style>
