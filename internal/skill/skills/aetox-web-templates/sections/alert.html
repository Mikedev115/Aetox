<!-- Alert. An inline status message — info, success, warning, danger — plus the
     grouped variant a multi-field form uses to summarise every error in one
     place for a screen reader user (WCAG's error-summary pattern).

     A single message uses role="status" when it does not need to interrupt
     (info, success) or role="alert" when it does (warning, danger); either
     way colour never carries the message alone, an icon mark and real text
     say it too. The summary links to each field by id so activating one
     moves focus straight to the problem instead of making the reader hunt. -->
<style>
  .w-alert{ display:flex; gap:12px; align-items:flex-start; padding:14px 16px;
            border:1px solid var(--line); border-radius:var(--radius);
            background:var(--surface) }
  .w-alert .mark{ flex:none; width:20px; height:20px; border-radius:50%;
                  display:grid; place-items:center; font:700 13px/1 var(--mono);
                  color:var(--bg) }
  .w-alert .body{ flex:1 }
  .w-alert .title{ font-weight:600; font-size:15px }
  .w-alert p{ color:var(--muted); font-size:14px; margin-top:2px }
  .w-alert--info{ border-color:color-mix(in srgb,var(--accent) 35%,var(--line)) }
  .w-alert--info .mark{ background:var(--accent) }
  .w-alert--success{ border-color:color-mix(in srgb,var(--success) 35%,var(--line)) }
  .w-alert--success .mark{ background:var(--success) }
  .w-alert--warning{ border-color:color-mix(in srgb,var(--warning) 35%,var(--line)) }
  .w-alert--warning .mark{ background:var(--warning) }
  .w-alert--danger{ border-color:color-mix(in srgb,var(--danger) 35%,var(--line)) }
  .w-alert--danger .mark{ background:var(--danger) }
  .w-alert .fields{ margin-top:8px; display:grid; gap:4px }
  .w-alert .fields a{ font-size:14px; color:var(--danger) }
</style>

<div class="w-alert w-alert--info" role="status">
  <span class="mark" aria-hidden="true">i</span>
  <div class="body">
    <p class="title">ฟีเจอร์นี้ยังเป็นรุ่นทดลอง</p>
    <p>ข้อมูลอาจเปลี่ยนแปลงได้ก่อนเปิดใช้งานจริง</p>
  </div>
</div>

<div class="w-alert w-alert--danger" role="alert" aria-labelledby="w-alert-err-h">
  <span class="mark" aria-hidden="true">!</span>
  <div class="body">
    <p class="title" id="w-alert-err-h">แก้ 2 ช่องนี้ก่อนส่ง</p>
    <div class="fields">
      <a href="#f-email">อีเมล — รูปแบบไม่ถูกต้อง</a>
      <a href="#f-pass">รหัสผ่าน — สั้นไป ต้องมีอย่างน้อย 8 ตัว</a>
    </div>
  </div>
</div>
