<!-- FAB. ปุ่มลอยที่กางเป็นเมนูเมื่อกด

     ปุ่มการกระทำหลักที่ลอยอยู่มุมจอ กางออกเป็นตัวเลือกย่อยพร้อมป้ายชื่อ ใช้กับแอปบนมือถือที่มีการกระทำหลักชัดเจนหนึ่งอย่าง

     ที่มา: gui-challenges ของ Adam Argyle (Apache License 2.0) โฟลเดอร์ `FAB`
     สำเนาอยู่ที่ third_party/gui-challenges พร้อมไฟล์ LICENSE และ ATTRIBUTION.md

     สิ่งที่เปลี่ยนจากต้นฉบับ ตามข้อผูกพันของ Apache 2.0 ที่ต้องระบุการแก้ไข:
     1. ต้นฉบับใช้ at-import ดึง open-props/style ซึ่งดึงจาก npm — ไฟล์นี้เปิดจากดิสก์
        ต้องรันได้ จึงไล่หาตัวแปรที่โค้ดนี้ใช้จริง 23 ตัว (ไล่ซ้ำจนครบสายโซ่
        ที่ตัวแปรอ้างตัวแปรต่อกัน) แล้วฝังมาเฉพาะที่ใช้ ไม่ได้ยกมาทั้ง 607 ตัว
        Open Props เป็น MIT ของผู้เขียนคนเดียวกัน สำเนาอยู่ที่ third_party/open-props
     2. คีย์เฟรมของ Open Props ที่อนิเมชันอ้างถึงอีก 0 ชุด ฝังมาด้วยด้วยเหตุผลเดียวกัน
     3. ครอบทุกกฎด้วยคลาสราก `.w-fab` ตามสัญญาของคลังนี้ สองเทมเพลตใน
        เอกสารเดียวกันจะได้เอื้อมถึงกันไม่ได้
     4. ตัดส่วนหัวและท้ายของหน้าเดโมเขาออก เหลือเฉพาะตัวคอมโพเนนต์ -->
<style>
  .w-fab {
    --ease-2: cubic-bezier(.25,0,.4,1);
    --ease-3: cubic-bezier(.25,0,.3,1);
    --ease-elastic-in-out-3: cubic-bezier(.5,-.5,.1,1.5);
    --ease-squish-3: var(--ease-elastic-in-out-3);
    --gray-6: #868e96;
    --gray-9: #212529;
    --layer-1: 1;
    --pink-3: #faa2c1;
    --pink-4: #f783ac;
    --pink-6: #e64980;
    --pink-7: #d6336c;
    --radius-round: 1e5px;
    --shadow-2: 0 3px 5px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 7px 14px -5px hsl(var(--shadow-color)/var(--shadow-strength-6));
    --shadow-4: 0 -2px 5px 0 hsl(var(--shadow-color)/var(--shadow-strength-3)),0 1px 1px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 2px 2px -2px hsl(var(--shadow-color)/var(--shadow-strength-4)),0 5px 5px -2px hsl(var(--shadow-color)/var(--shadow-strength-5)),0 9px 9px -2px hsl(var(--shadow-color)/var(--shadow-strength-6)),0 16px 16px -2px hsl(var(--shadow-color)/var(--shadow-strength-7));
    --shadow-color: 220 40% 2%;
    --shadow-strength: 10%;
    --shadow-strength-3: calc(var(--shadow-strength) + 2%);
    --shadow-strength-4: calc(var(--shadow-strength) + 3%);
    --shadow-strength-5: calc(var(--shadow-strength) + 4%);
    --shadow-strength-6: calc(var(--shadow-strength) + 5%);
    --shadow-strength-7: calc(var(--shadow-strength) + 6%);
    --surface-1: var(--gray-9);
    --surface-4: var(--gray-6);
  }


.w-fab .fabs {
  --_viewport-margin: 2.5vmin;

  position: fixed;
  z-index: var(--layer-1);
  display: flex;
  flex-direction: column-reverse;
  place-items: center;
  gap: var(--_viewport-margin);

  inset-block: auto var(--_viewport-margin);
  inset-inline: auto var(--_viewport-margin);
}
.w-fab .fab {
  --_size: 2rem;

  --_light-bg: var(--pink-6);
  --_light-bg-hover: var(--pink-7);
  --_dark-bg: var(--pink-4);
  --_dark-bg-hover: var(--pink-3);
  --_bg: var(--_light-bg);

  --_light-fg: white;
  --_dark-fg: black;
  --_fg: var(--_light-fg);
  
  padding: calc(var(--_size) / 2);

  border-radius: var(--radius-round);
  aspect-ratio: 1;

  background: var(--_bg);
  color: var(--_fg);
  box-shadow: var(--shadow-4);

  -webkit-tap-highlight-color: transparent;

  --_motion-reduced: 
    box-shadow .2s var(--ease-3),
    background-color .3s var(--ease-3);
  --_motion-ok: 
    var(--_motion-reduced),
    transform .2s var(--ease-3),
    outline-offset 145ms var(--ease-2);
  --_transition: var(--_motion-reduced);
  transition: var(--_transition);

  @media (--motionOK) {
    --_transition: var(--_motion-ok);
  }

  @media (--OSdark) {
    --_bg: var(--_dark-bg);
    --_fg: var(--_dark-fg);
  }

  &.mini {
    --_size: 1.25rem;
  }

  & > svg {
    inline-size: var(--_size);
    block-size: var(--_size);
    stroke-width: 3px;
    
    @media (--motionOK) {
      will-change: transform;
      transition: transform .5s var(--ease-squish-3);
    }
  }

  &:active {
    box-shadow: var(--shadow-2);
    
    @media (--motionOK) {
      transform: translateY(2%);
    }
  }

  &:is(:active, :hover, :focus-visible) {
    --_bg: var(--_light-bg-hover);

    @media (--OSdark) {
      --_bg: var(--_dark-bg-hover);      
    }
  }

  &:not(:first-of-type) {
    z-index: -1;
  }

  &[data-icon="plus"]:hover > svg {
    transform: rotateZ(.25turn);
  }
}
.w-fab .github-corner {
  position: absolute;
  right: 4px;
  width: 80px;
  height: 80px;
  fill: var(--surface-4);
  color: var(--surface-1);
  
  &:hover .octo-arm {
    animation: octocat-wave 560ms ease-in-out
  }

  & > svg {
    fill: inherit;
    stroke: inherit;
    position: absolute; 
    top: 0; 
    right: 0;
  }
}
@keyframes octocat-wave {
  0%,100% {
    transform: rotate(0)
  }
  20%,60% {
    transform: rotate(-25deg)
  }
  40%,80% {
    transform: rotate(10deg)
  }
}


</style>

          </svg>
        </a>
  </div>
</section>
