<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vertical Outro · the name, one line, and where to go</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /*
   * vertical-outro — the last card of the vertical set. A wordmark at headline size, one
   * line under it, a handle, and nothing else.
   *
   * Original work for Aetox, 4 ก.ย. 2569. Safe-area numbers and their source are in
   * `vertical-title.html`.
   *
   * Two decisions here are borrowed from a real film rather than invented, both recorded
   * under "The edit, measured" in `references/google-register.md`:
   *
   *   The ending is COLOURLESS and held. Measured over the last three seconds of that
   *   film: mean luminance L5 out of 255, saturation exactly 0.00, and no cut. Every hue
   *   in this scene drains out before the wordmark lands, which is why the four pips sit
   *   under the name rather than beside the headline — they are the last colour to go.
   *
   *   The wordmark is LARGE. At small size the same idea reads as a footer rather than an
   *   ending; 108px on a 1080 frame is roughly the proportion the film uses.
   *
   * Vertical adds one of its own: the handle repeats at the foot of the safe area even
   * though the wordmark already names the account, because a viewer who arrives mid-scroll
   * reads the bottom third first.
   *
   * Timeline (4.0s @ 60fps): the field drains -> wordmark springs in -> line -> pips ->
   * handle -> held on near-black.
   */

  :root {
    --safe-x: 120px; --safe-top: 200px; --safe-bottom: 300px;
    --sp-fast: linear(0, 0.0377, 0.1329, 0.2618, 0.4052, 0.5487, 0.6819, 0.7985, 0.895, 0.9705, 1.0258, 1.0629, 1.0846, 1.0939, 1.0937, 1.0869, 1.0759, 1.0627, 1.049, 1.0358, 1.024, 1.0139, 1.0059, 0.9998, 0.9955, 0.9928, 0.9914, 0.991, 0.9914, 0.9923, 0.9935, 0.9948, 1);
    --sp-effects: linear(0, 0.0248, 0.0849, 0.1641, 0.2514, 0.3396, 0.4245, 0.5033, 0.5747, 0.6384, 0.6943, 0.7428, 0.7846, 0.8203, 0.8506, 0.8761, 0.8976, 0.9156, 0.9305, 0.943, 0.9532, 0.9617, 0.9688, 0.9745, 0.9792, 0.9831, 0.9863, 0.9889, 0.991, 0.9927, 0.9941, 0.9952, 1);
    --t-fast: 330ms; --t-effects: 193ms;
    --stage: #0B0C0F;
    --a1: #3B4AE0; --a2: #E8543F; --a3: #F2B33D; --a4: #1F9D74;
    --dim: #7E8593;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px; overflow: hidden; position: relative; background: var(--stage);
    font-family: 'Google Sans', 'Anuphan', 'IBM Plex Sans Thai', system-ui, sans-serif;
    color: #fff;
  }

  /* the colour leaves before the name arrives — the ending is meant to be colourless */
  .field { position: absolute; inset: -10%; opacity: .38; filter: blur(90px);
    background: radial-gradient(880px 950px at 34% 32%, var(--a1) 0%, transparent 60%),
                radial-gradient(760px 860px at 76% 70%, var(--a2) 0%, transparent 58%);
    animation: drain 900ms var(--sp-effects) .15s forwards; }
  @keyframes drain { to { opacity: 0; } }
  .grain { position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.035) 1px, transparent 0);
    background-size: 40px 40px; }

  .safe { position: absolute; left: var(--safe-x); right: var(--safe-x);
    top: var(--safe-top); bottom: var(--safe-bottom);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

  .word { font-size: 108px; font-weight: 400; letter-spacing: -0.0225em; line-height: 1;
    opacity: 0; transform: scale(.93);
    animation: fade var(--t-effects) var(--sp-effects) .72s forwards,
               popIn var(--t-fast) var(--sp-fast) .72s forwards; }
  @keyframes fade  { to { opacity: 1; } }
  @keyframes popIn { to { transform: scale(1); } }

  .line { font-size: 40px; line-height: 1.4; color: #B4BAC6; margin-top: 40px; max-width: 720px;
    opacity: 0; animation: fade var(--t-effects) var(--sp-effects) 1.14s forwards; }

  .pips { display: flex; gap: 14px; margin-top: 52px; }
  .pips i { width: 20px; height: 20px; border-radius: 50%; display: block;
    opacity: 0; transform: scale(.5);
    animation: fade var(--t-effects) var(--sp-effects) forwards,
               popIn var(--t-fast) var(--sp-fast) forwards; }
  .pips i:nth-child(1){background:var(--a1);animation-delay:1.42s,1.42s}
  .pips i:nth-child(2){background:var(--a4);animation-delay:1.50s,1.50s}
  .pips i:nth-child(3){background:var(--a3);animation-delay:1.58s,1.58s}
  .pips i:nth-child(4){background:var(--a2);animation-delay:1.66s,1.66s}

  /* repeated at the foot on purpose — a mid-scroll viewer reads the bottom third first */
  .handle { position: absolute; left: 0; right: 0; bottom: var(--safe-bottom); text-align: center;
    font-size: 30px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--dim);
    opacity: 0; animation: fade var(--t-effects) var(--sp-effects) 1.92s forwards; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .field { opacity: 0; }
    .word, .line, .handle { opacity: 1; transform: none; }
    .pips i { opacity: 1; transform: none; }
  }
</style>
</head>
<!-- PORTRAIT: 1080x1920. 4.0s is the handle settling at 2.11s and then a long hold, which
     an ending needs more than any other card — the hold IS the ending, not padding. -->
<body data-composition-id="scene" data-no-timeline data-width="1080" data-height="1920" data-start="0" data-duration="4.0">
  <div class="field"></div>
  <div class="grain"></div>

  <div class="safe">
    <div class="word">Aetox</div>
    <div class="line">Sixty scenes on the shelf. Change the words, keep the seconds.</div>
    <div class="pips"><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="handle">aetox.app</div>
</body>
</html>
