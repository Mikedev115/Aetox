<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ship It Toolbar · the thing you made, and the button that sends it</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /*
   * ship-it-toolbar — the finished thing sitting under its own toolbar, a cursor reaching
   * for the one button that matters, and a hard resolve to a mark alone on black.
   * The closing half of a build-something film: `aurora-prompt-box` is the opening half.
   *
   * Original work for Aetox, 4 ก.ย. 2569. See references/google-register.md.
   *
   * WHAT WAS WATCHED. The same 31.4s Google for Developers film as `aurora-prompt-box`,
   * stepped frame by frame on 4 ก.ย. 2569, and its frames sampled for colour by drawing
   * them to a canvas and bucketing saturated pixels by hue. Two findings shaped this file:
   *
   *   At t=21s the frame is not neutral — it is **flooded with warm light**: hue 40°
   *   across ~29,600px and hue 20° across ~18,300px, averaging #977017 and #9C4326. The
   *   beat where the thing gets shipped is lit differently from every beat before it. That
   *   is the single most transferable idea in the whole film and it costs nothing: light
   *   the payoff warmer than the work.
   *
   *   At t=28.5s the film ends on **a mark alone, small, dead centre, on near-black**. No
   *   headline, no URL, no tagline. After thirty seconds of interface, the restraint is
   *   the punctuation. It is copied here as a shape, not as an image.
   *
   * Surface values (stage #121317, card gradient #1C1E23 -> #2A2D35 at 20px, white pill at
   * 12px) are measured off aistudio.google.com, same date. The warm hues here are ours:
   * the film's #977017 is a lighting choice, but a palette is an identity.
   *
   *
   * CORRECTED 4 ก.ย. 2569, after the film was finally seen properly. The first pass read
   * it off 64x36 average-colour samples and a browser pane 470px wide, which was not
   * enough to read a layout from. Cropping half a frame into a full-viewport canvas gave
   * 1.6x native and settled several things that had been guessed:
   *
   *   - the colour is BEHIND the panel, full-bleed and soft, and it is there the whole
   *     time — not only at the payoff. At t=16.6s the field runs green on the left to
   *     orange on the right, with the dark panel floating on top of it and a margin of
   *     bare colour showing all the way round. The panel never fills the frame.
   *   - Share, Publish and Install are OUTLINED pills. Remix is plain text with an icon.
   *     Nothing in that toolbar is a solid block.
   *   - the ending is a large WORDMARK, not a small mark: type at headline size, centred
   *     on black, alone.
   *   - the cursor is a large bright green arrow.
   *
   * Timeline (6.0s @ 30fps): surface rises -> toolbar staggers in -> cursor crosses to
   * Install -> press at 2.6s, warm light floods -> 3.4s hard cut to the mark, centred,
   * held for the rest.
   */

  :root {
    /* M3 Expressive springs, simulated from AOSP damping/stiffness (mass 1) */
    /* spatial fast 0.6/800 — settles 330ms — overshoots to 1.0939 */
    --sp-fast: linear(0, 0.0377, 0.1329, 0.2618, 0.4052, 0.5487, 0.6819, 0.7985, 0.895, 0.9705, 1.0258, 1.0629, 1.0846, 1.0939, 1.0937, 1.0869, 1.0759, 1.0627, 1.049, 1.0358, 1.024, 1.0139, 1.0059, 0.9998, 0.9955, 0.9928, 0.9914, 0.991, 0.9914, 0.9923, 0.9935, 0.9948, 1);
    /* spatial default 0.8/380 — settles 382ms — peak 1.0151 */
    --sp-default: linear(0, 0.0239, 0.0843, 0.1671, 0.2617, 0.3601, 0.4567, 0.5478, 0.6309, 0.7047, 0.7689, 0.8236, 0.8692, 0.9065, 0.9364, 0.9599, 0.9779, 0.9913, 1.0009, 1.0075, 1.0117, 1.0141, 1.0151, 1.0151, 1.0144, 1.0133, 1.0119, 1.0105, 1.009, 1.0075, 1.0062, 1.005, 1);
    /* effects default 1.0/1600 — settles 193ms — never overshoots */
    --sp-effects: linear(0, 0.0248, 0.0849, 0.1641, 0.2514, 0.3396, 0.4245, 0.5033, 0.5747, 0.6384, 0.6943, 0.7428, 0.7846, 0.8203, 0.8506, 0.8761, 0.8976, 0.9156, 0.9305, 0.943, 0.9532, 0.9617, 0.9688, 0.9745, 0.9792, 0.9831, 0.9863, 0.9889, 0.991, 0.9927, 0.9941, 0.9952, 1);
    --t-fast: 330ms; --t-default: 382ms; --t-effects: 193ms;
    --e-emphasized: linear(0, 0.0141, 0.0616, 0.1622, 0.4, 0.6686, 0.7728, 0.8315, 0.8706, 0.8989, 0.9204, 0.9372, 0.9506, 0.9614, 0.9701, 0.9773, 0.983, 0.9877, 0.9914, 0.9943, 0.9965, 0.9981, 0.9992, 0.9998, 1);

    --stage: #121317; --surface: #1C1E23; --surface-2: #2A2D35;
    --hair: rgba(255,255,255,.10);
    --paper: #FFFFFF; --paper-ink: #0E0F12; --dim: #9AA0AE;
    --a1: #3B4AE0; --a2: #E8543F; --a3: #F2B33D; --a4: #1F9D74;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden; position: relative; background: var(--stage);
    font-family: 'Google Sans Flex', 'Google Sans', 'Anuphan', 'IBM Plex Sans Thai', system-ui, sans-serif;
    color: #fff;
  }
  .grain { position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.03) 1px, transparent 0);
    background-size: 44px 44px; }

  /* The colour field the panel floats on. Present from the first frame, because in the
     film it always is — the payoff changes its hue, it does not switch it on. Two hues
     across the frame rather than a centred glow, which is the shape the film uses. */
  .field { position: absolute; inset: -8%; opacity: 0; filter: blur(70px);
    background: linear-gradient(105deg, var(--a4) 0%, #2C6E5A 26%, #6A4A2A 62%, var(--a2) 100%);
    animation: fieldIn 900ms var(--sp-effects) .10s forwards,
               fieldOut 260ms linear 3.40s forwards; }
  @keyframes fieldIn  { to { opacity: .40; } }
  @keyframes fieldOut { to { opacity: 0; } }

  /* ---- the warm flood. Off until the press, then it owns the frame. ---- */
  .warm { position: absolute; inset: -10%; opacity: 0; pointer-events: none;
    background: radial-gradient(1400px 900px at 50% -6%, var(--a3) 0%, var(--a2) 34%, transparent 68%);
    filter: blur(60px);
    animation: warmIn 520ms var(--sp-effects) 2.6s forwards,
               warmOut 260ms linear 3.40s forwards; }
  @keyframes warmIn  { to { opacity: .62; } }
  /* The flood goes with the cut. Left standing it would put the closing mark on an amber
     wash, and the whole point of that ending is that it lands on near-black. */
  @keyframes warmOut { to { opacity: 0; } }

  /* ---- act one: the surface and its toolbar ---- */
  .act1 { position: absolute; inset: 0;
    animation: actOut 260ms linear 3.40s forwards; }
  @keyframes actOut { to { opacity: 0; } }

  .bar { position: absolute; left: 300px; right: 300px; top: 208px; display: flex; align-items: center; gap: 30px;
    opacity: 0; transform: translateY(-22px);
    animation: fade var(--t-effects) var(--sp-effects) .48s forwards,
               drop var(--t-default) var(--sp-default) .48s forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes drop { to { transform: translateY(0); } }
  .bar .txt { font-size: 24px; font-weight: 500; color: var(--dim); }
  /* outlined, never filled — see the note at the top of this file */
  .bar .pill { font-size: 24px; font-weight: 500; color: #E8EAF0;
    padding: 11px 24px; border-radius: 999px; border: 1px solid rgba(255,255,255,.26); }
  .bar .spacer { flex: 1; }
  .bar .circ { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--hair);
    display: grid; place-items: center; color: var(--dim); }
  .bar .circ svg { width: 22px; height: 22px; }

  .install { display: inline-flex; align-items: center; gap: 13px; padding: 15px 28px; border-radius: 999px;
    background: transparent; border: 1px solid rgba(255,255,255,.30); color: #E8EAF0;
    font-size: 24px; font-weight: 500;
    animation: press 380ms var(--sp-fast) 2.58s forwards; }
  .install svg { width: 22px; height: 22px; }
  /* A press is a dip and a return, not a fade to a new colour: the button has to look like
     it took the weight. The spring is what makes the return read as a release. It stays an
     outline throughout — the first draft filled it solid white, which the film never does. */
  @keyframes press {
    0%   { transform: scale(1);    border-color: rgba(255,255,255,.30); background: transparent; }
    38%  { transform: scale(.955); border-color: #fff; background: rgba(255,255,255,.16); }
    100% { transform: scale(1);    border-color: #fff; background: rgba(255,255,255,.10); }
  }

  .surface { position: absolute; left: 300px; right: 300px; top: 288px; bottom: 168px;
    border-radius: 20px; border: 1px solid var(--hair); overflow: hidden;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
    box-shadow: 0 40px 100px rgba(0,0,0,.55);
    opacity: 0; transform: translateY(64px);
    animation: fade var(--t-effects) var(--sp-effects) .18s forwards,
               drop var(--t-fast) var(--sp-fast) .18s forwards; }

  /* a plausible built thing, drawn rather than screenshotted — a real capture leaks real data */
  .app { position: absolute; inset: 54px 64px; display: flex; gap: 44px; }
  .app .col { flex: 1; }
  .app .h { font-size: 54px; font-weight: 500; letter-spacing: -1.2px; }
  .app .p { font-size: 26px; color: var(--dim); margin-top: 18px; line-height: 1.5; max-width: 560px; }
  .app .rows { margin-top: 46px; display: flex; flex-direction: column; gap: 16px; }
  .app .row { height: 68px; border-radius: 14px; background: rgba(255,255,255,.045);
    border: 1px solid var(--hair); display: flex; align-items: center; padding: 0 24px; gap: 18px; }
  .app .row i { width: 34px; height: 34px; border-radius: 10px; flex: none; }
  .app .row s { display: block; height: 12px; border-radius: 6px; background: rgba(255,255,255,.12);
    text-decoration: none; }
  .app .panel { width: 520px; border-radius: 16px; border: 1px solid var(--hair);
    background: rgba(255,255,255,.03); padding: 34px; }
  .app .panel .big { font-size: 96px; font-weight: 500; letter-spacing: -3px; line-height: 1; }
  .app .panel .lbl { font-size: 22px; color: var(--dim); margin-top: 14px; letter-spacing: 1.4px; text-transform: uppercase; }
  .app .panel .bars { display: flex; align-items: flex-end; gap: 12px; height: 180px; margin-top: 40px; }
  .app .panel .bars b { flex: 1; border-radius: 8px 8px 0 0; background: rgba(255,255,255,.14); }

  .cursor { position: absolute; z-index: 30; width: 54px; height: 54px;
    transform: translate(620px, 880px); opacity: 0;
    animation: fade var(--t-effects) var(--sp-effects) 1.20s forwards,
               toInstall 900ms var(--e-emphasized) 1.60s forwards; }
  @keyframes toInstall { to { transform: translate(1508px, 232px); } }
  .cursor svg { width: 54px; height: 54px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(63,217,164,.35)); }

  /* ---- act two: the mark, alone ---- */
  /* Cut, not crossfaded. The film cuts here and a dissolve would soften the one moment
     that is meant to land hard. The mark then arrives on a spring, by itself. */
  .act2 { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    animation: fade 1ms linear 3.40s forwards; }
  /* A wordmark at headline size, centred, alone. The first draft closed on a small
     four-bar glyph; the film closes on its name, large, and nothing else on the frame.
     The restraint only works at this size — shrink it and it reads as a footer. */
  .mark { display: flex; align-items: center; gap: 26px; opacity: 0; transform: scale(.94);
    font-size: 92px; font-weight: 400; letter-spacing: -0.0225em; color: #fff;
    animation: fade var(--t-effects) var(--sp-effects) 3.52s forwards,
               popIn var(--t-default) var(--sp-default) 3.52s forwards; }
  @keyframes popIn { to { transform: scale(1); } }
  .mark .glyph { display: flex; gap: 7px; }
  .mark .glyph i { width: 13px; height: 44px; border-radius: 999px; display: block; }
  .mark .glyph i:nth-child(1) { background: var(--a1); }
  .mark .glyph i:nth-child(2) { background: var(--a4); height: 30px; align-self: flex-end; }
  .mark .glyph i:nth-child(3) { background: var(--a3); height: 30px; }
  .mark .glyph i:nth-child(4) { background: var(--a2); }

  @media (prefers-reduced-motion: reduce) {
    /* The film's own ending, held: the mark by itself. Act one exists to be left behind. */
    * { animation: none !important; }
    .act1, .warm, .field, .cursor { opacity: 0; }
    .act2, .mark { opacity: 1; transform: none; }
  }
</style>
</head>
<!-- Frame and length stated because the renderer reads neither off the CSS: with no
     data-width/data-height it renders 1080x1920 and crops this silently, with no
     data-duration `video check` reports none. 6.0s is act one to 3.4s, the cut, the mark
     landing at 3.85s, and then a long hold — the hold is the ending, not padding. -->
<body data-composition-id="scene" data-no-timeline data-width="1920" data-height="1080" data-start="0" data-duration="6.0">
  <div class="field"></div>
  <div class="grain"></div>

  <div class="act1">
    <div class="bar">
      <span class="txt">Remix</span>
      <span class="pill">Share</span>
      <span class="pill">Publish</span>
      <span class="spacer"></span>
      <span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></span>
      <span class="circ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg></span>
      <span class="install">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>
        Install
      </span>
    </div>

    <div class="surface">
      <div class="app">
        <div class="col">
          <div class="h">Weather, for one window.</div>
          <div class="p">Built from a sentence, running on the phone in your hand, nine minutes after the sentence.</div>
          <div class="rows">
            <div class="row"><i style="background:var(--a1)"></i><s style="width:280px"></s></div>
            <div class="row"><i style="background:var(--a4)"></i><s style="width:210px"></s></div>
            <div class="row"><i style="background:var(--a3)"></i><s style="width:330px"></s></div>
          </div>
        </div>
        <div class="panel">
          <div class="big">31°</div>
          <div class="lbl">Bangkok · feels 38°</div>
          <div class="bars">
            <b style="height:44%"></b><b style="height:62%"></b><b style="height:53%"></b>
            <b style="height:81%"></b><b style="height:70%"></b><b style="height:96%"></b><b style="height:58%"></b>
          </div>
        </div>
      </div>
    </div>

    <div class="cursor">
      <svg viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12 22 L15 20.5 L12 14.5 L19 14 Z" fill="#3FD9A4" stroke="#0B1F19" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="warm"></div>

  <div class="act2">
    <div class="mark"><span class="glyph"><i></i><i></i><i></i><i></i></span>Aetox</div>
  </div>
</body>
</html>
